<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文練習 | A2 → B1</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #4ade80;
      --error: #f87171;
      --warning: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      line-height: 1.5;
    }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.45rem; margin-bottom: 4px; text-align: center; }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 16px; font-size: 0.9rem; }

    .stats {
      background: var(--card);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      font-size: 0.85rem;
    }
    .stats div strong { display: block; font-size: 1.2rem; color: var(--accent); }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab {
      flex: 1; padding: 11px; border: none; border-radius: 10px;
      background: var(--card); color: var(--text); font-size: 0.95rem; cursor: pointer;
    }
    .tab.active { background: var(--accent); color: #0f172a; font-weight: 600; }

    .panel { display: none; }
    .panel.active { display: block; }

    .flashcard {
      background: var(--card); border-radius: 16px; padding: 28px 20px;
      min-height: 210px; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      margin-bottom: 12px; position: relative; transition: transform 0.15s;
    }
    .flashcard:active { transform: scale(0.98); }
    .flashcard .label { position: absolute; top: 10px; left: 14px; font-size: 0.72rem; color: var(--muted); }
    .flashcard .badge {
      position: absolute; top: 10px; right: 14px; font-size: 0.7rem;
      padding: 2px 8px; border-radius: 20px; background: #334155;
    }
    .flashcard .badge.weak { background: var(--error); color: #0f172a; }
    .flashcard .front, .flashcard .back { width: 100%; }
    .flashcard .back { display: none; }
    .flashcard.flipped .front { display: none; }
    .flashcard.flipped .back { display: block; }
    .card-text { font-size: 1.3rem; margin-bottom: 6px; }
    .card-note { font-size: 0.88rem; color: var(--muted); margin-top: 10px; }
    .card-example { font-size: 0.92rem; color: var(--accent); margin-top: 6px; }

    .controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
    button.btn {
      padding: 11px 16px; border: none; border-radius: 10px;
      font-size: 0.95rem; cursor: pointer; background: var(--card); color: var(--text);
    }
    button.btn.primary { background: var(--accent); color: #0f172a; font-weight: 600; }
    button.btn.success { background: var(--success); color: #0f172a; }
    button.btn.warning { background: var(--warning); color: #0f172a; }

    .progress { text-align: center; color: var(--muted); margin: 8px 0; font-size: 0.88rem; }

    .question-card {
      background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 12px;
    }
    .q-num { color: var(--muted); font-size: 0.8rem; margin-bottom: 6px; }
    .q-text { font-size: 1.08rem; margin-bottom: 12px; }
    .options { display: flex; flex-direction: column; gap: 7px; }
    .option {
      padding: 11px 14px; background: #334155; border-radius: 10px; cursor: pointer;
    }
    .option:hover { background: #475569; }
    .option.selected { background: var(--accent); color: #0f172a; }
    .option.correct { background: var(--success); color: #0f172a; }
    .option.wrong { background: var(--error); color: #0f172a; }
    .fill-input {
      width: 100%; padding: 11px; border-radius: 10px;
      border: 2px solid #334155; background: #0f172a; color: var(--text); font-size: 1rem;
    }
    .result { margin-top: 16px; text-align: center; font-size: 1.05rem; }
    .score { font-size: 1.9rem; font-weight: 700; color: var(--accent); }

    .weak-list {
      background: var(--card); border-radius: 12px; padding: 12px 16px; margin-top: 16px;
      font-size: 0.88rem;
    }
    .weak-list h3 { font-size: 0.95rem; margin-bottom: 8px; color: var(--warning); }

    footer { text-align: center; margin-top: 32px; color: var(--muted); font-size: 0.78rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>英文練習</h1>
    <p class="subtitle">A2 → B1 · 有進度記憶 + 優先練弱點</p>

    <div class="stats" id="stats">
      <div><strong id="stat-quizzes">0</strong>練習次數</div>
      <div><strong id="stat-avg">-</strong>平均正確率</div>
      <div><strong id="stat-weak">0</strong>需加強</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="flash">Flashcard</button>
      <button class="tab" data-tab="quiz">練習題</button>
    </div>

    <!-- Flashcard -->
    <div id="flash" class="panel active">
      <div class="progress" id="flash-progress">1 / 6</div>
      <div class="flashcard" id="card" onclick="flipCard()">
        <div class="label">點擊翻面</div>
        <div class="badge" id="card-badge"></div>
        <div class="front">
          <div class="card-text" id="front-text"></div>
        </div>
        <div class="back">
          <div class="card-text" id="back-text"></div>
          <div class="card-note" id="back-note"></div>
          <div class="card-example" id="back-example"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn" onclick="prevCard()">上一張</button>
        <button class="btn warning" onclick="markWeak()">還不熟</button>
        <button class="btn success" onclick="markKnown()">已掌握</button>
        <button class="btn primary" onclick="nextCard()">下一張</button>
      </div>
      <div class="weak-list" id="weak-box" style="display:none">
        <h3>目前需加強的重點</h3>
        <div id="weak-items"></div>
      </div>
    </div>

    <!-- Quiz -->
    <div id="quiz" class="panel">
      <div id="quiz-area"></div>
      <div class="controls" style="margin-top:16px">
        <button class="btn primary" id="submit-btn" onclick="submitQuiz()">提交答案</button>
        <button class="btn" id="retry-btn" style="display:none" onclick="startQuiz()">再練一次</button>
      </div>
      <div class="result" id="result" style="display:none"></div>
    </div>

    <footer>進度存在瀏覽器 localStorage · 清除資料請開 Console 執行 localStorage.clear()</footer>
  </div>

  <script>
    // ===== Data =====
    const cards = [
      { id: "c1", front: "我去過日本。", back: "I have been to Japan.", note: "Present Perfect：有過某種經驗用 have/has + been", example: "She has been to Taiwan." },
      { id: "c2", front: "我昨天去了公園。", back: "I went to the park yesterday.", note: "有明確過去時間 → 用 Past Simple", example: "He bought a book last week." },
      { id: "c3", front: "因為下雨，所以我留在家。", back: "I stayed home because it was raining.", note: "because 用來說明原因", example: "She was late because of the traffic." },
      { id: "c4", front: "雖然很累，我還是完成了工作。", back: "Although I was tired, I finished the work.", note: "although / though 表示「雖然」", example: "Although it was expensive, I bought it." },
      { id: "c5", front: "你做完功課了嗎？", back: "Have you finished your homework?", note: "Present Perfect 常用來問到目前為止的完成情況", example: "Has she called you yet?" },
      { id: "c6", front: "我從來沒吃過這個。", back: "I have never eaten this.", note: "never / ever 常跟 Present Perfect 一起用", example: "Have you ever tried sushi?" },
      { id: "c7", front: "我們約在星期五見面。", back: "We are meeting on Friday.", note: "星期幾前面用 on", example: "The meeting is on Monday." },
      { id: "c8", front: "他對這件事很有興趣。", back: "He is interested in this.", note: "interested in + 事物", example: "I'm interested in learning English." }
    ];

    const questions = [
      { id: "q1", type: "mc", q: "選擇正確的句子", options: ["I have went to Japan.", "I have been to Japan.", "I has been to Japan."], answer: 1, point: "Present Perfect" },
      { id: "q2", type: "fill", q: "我昨天看了一部電影。 → I ______ a movie yesterday.", answer: "watched", point: "Past Simple" },
      { id: "q3", type: "mc", q: "選擇正確的連接詞：___ it was raining, we went out.", options: ["Because", "Although", "So"], answer: 1, point: "Connecting words" },
      { id: "q4", type: "fill", q: "你曾經去過香港嗎？ → ______ you ever been to Hong Kong?", answer: "have", point: "Present Perfect" },
      { id: "q5", type: "mc", q: "選擇正確的句子", options: ["She is interested on music.", "She is interested in music.", "She interested in music."], answer: 1, point: "Collocation" },
      { id: "q6", type: "fill", q: "因為我很忙，所以沒回覆。 → I didn't reply ______ I was busy.", answer: "because", point: "Connecting words" }
    ];

    // ===== Storage helpers =====
    const STORAGE_KEY = "englishPracticeData";

    function loadData() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { quizHistory: [], cardStatus: {}, weakPoints: {} };
      } catch {
        return { quizHistory: [], cardStatus: {}, weakPoints: {} };
      }
    }

    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      updateStats();
    }

    let data = loadData();

    // ===== Stats =====
    function updateStats() {
      const history = data.quizHistory || [];
      document.getElementById("stat-quizzes").textContent = history.length;

      if (history.length > 0) {
        const avg = Math.round(history.reduce((s, h) => s + h.percent, 0) / history.length);
        document.getElementById("stat-avg").textContent = avg + "%";
      } else {
        document.getElementById("stat-avg").textContent = "-";
      }

      const weakCount = Object.values(data.cardStatus || {}).filter(s => s === "weak").length +
                        Object.keys(data.weakPoints || {}).length;
      document.getElementById("stat-weak").textContent = weakCount;

      // weak list
      const weakBox = document.getElementById("weak-box");
      const weakItems = document.getElementById("weak-items");
      const weaks = [];
      Object.entries(data.cardStatus || {}).forEach(([id, status]) => {
        if (status === "weak") {
          const c = cards.find(x => x.id === id);
          if (c) weaks.push(c.front + " → " + c.back);
        }
      });
      Object.entries(data.weakPoints || {}).forEach(([point, count]) => {
        if (count > 0) weaks.push(point + " (錯過 " + count + " 次)");
      });

      if (weaks.length) {
        weakBox.style.display = "block";
        weakItems.innerHTML = weaks.slice(0, 6).map(w => "• " + w).join("<br>");
      } else {
        weakBox.style.display = "none";
      }
    }

    // ===== Flashcard with priority =====
    let orderedCards = [];
    let current = 0;

    function buildCardOrder() {
      // Prioritize weak cards first
      const weak = [];
      const normal = [];
      const known = [];
      cards.forEach(c => {
        const status = (data.cardStatus || {})[c.id];
        if (status === "weak") weak.push(c);
        else if (status === "known") known.push(c);
        else normal.push(c);
      });
      // shuffle helpers
      const shuffle = arr => arr.sort(() => Math.random() - 0.5);
      orderedCards = [...shuffle(weak), ...shuffle(normal), ...shuffle(known)];
      current = 0;
    }

    function showCard() {
      if (!orderedCards.length) buildCardOrder();
      const c = orderedCards[current];
      document.getElementById("front-text").textContent = c.front;
      document.getElementById("back-text").textContent = c.back;
      document.getElementById("back-note").textContent = c.note;
      document.getElementById("back-example").textContent = "例句：" + c.example;
      document.getElementById("flash-progress").textContent = (current + 1) + " / " + orderedCards.length;

      const badge = document.getElementById("card-badge");
      const status = (data.cardStatus || {})[c.id];
      if (status === "weak") {
        badge.textContent = "需加強";
        badge.className = "badge weak";
      } else if (status === "known") {
        badge.textContent = "已掌握";
        badge.className = "badge";
      } else {
        badge.textContent = "";
        badge.className = "badge";
      }

      document.getElementById("card").classList.remove("flipped");
    }

    function flipCard() {
      document.getElementById("card").classList.toggle("flipped");
    }

    function nextCard() {
      current = (current + 1) % orderedCards.length;
      showCard();
    }

    function prevCard() {
      current = (current - 1 + orderedCards.length) % orderedCards.length;
      showCard();
    }

    function markWeak() {
      const c = orderedCards[current];
      data.cardStatus = data.cardStatus || {};
      data.cardStatus[c.id] = "weak";
      saveData(data);
      showCard();
    }

    function markKnown() {
      const c = orderedCards[current];
      data.cardStatus = data.cardStatus || {};
      data.cardStatus[c.id] = "known";
      saveData(data);
      showCard();
    }

    // ===== Quiz =====
    let userAnswers = [];

    function startQuiz() {
      userAnswers = [];
      const area = document.getElementById("quiz-area");
      area.innerHTML = "";
      document.getElementById("result").style.display = "none";
      document.getElementById("submit-btn").style.display = "inline-block";
      document.getElementById("retry-btn").style.display = "none";

      // simple prioritization: put previously weak point questions first
      const sortedQ = [...questions].sort((a, b) => {
        const wa = (data.weakPoints || {})[a.point] || 0;
        const wb = (data.weakPoints || {})[b.point] || 0;
        return wb - wa;
      });

      sortedQ.forEach((q, i) => {
        const div = document.createElement("div");
        div.className = "question-card";
        div.dataset.qid = q.id;
        div.innerHTML = `<div class="q-num">第 ${i + 1} 題 · ${q.point}</div><div class="q-text">${q.q}</div>`;

        if (q.type === "mc") {
          const opts = document.createElement("div");
          opts.className = "options";
          q.options.forEach((opt, j) => {
            const o = document.createElement("div");
            o.className = "option";
            o.textContent = opt;
            o.onclick = () => {
              opts.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
              o.classList.add("selected");
              userAnswers[i] = { id: q.id, value: j, point: q.point, type: "mc", correct: q.answer };
            };
            opts.appendChild(o);
          });
          div.appendChild(opts);
        } else {
          const input = document.createElement("input");
          input.className = "fill-input";
          input.placeholder = "請輸入答案";
          input.oninput = (e) => {
            userAnswers[i] = { id: q.id, value: e.target.value.trim().toLowerCase(), point: q.point, type: "fill", correct: q.answer.toLowerCase() };
          };
          div.appendChild(input);
        }
        area.appendChild(div);
      });

      // store order for scoring
      window._currentQuestions = sortedQ;
    }

    function submitQuiz() {
      const qs = window._currentQuestions || questions;
      let correct = 0;
      const cardsEl = document.querySelectorAll(".question-card");

      qs.forEach((q, i) => {
        const ans = userAnswers[i];
        const isCorrect = ans && (
          (q.type === "mc" && ans.value === q.answer) ||
          (q.type === "fill" && ans.value === q.answer.toLowerCase())
        );

        if (isCorrect) {
          correct++;
        } else {
          // record weak point
          data.weakPoints = data.weakPoints || {};
          data.weakPoints[q.point] = (data.weakPoints[q.point] || 0) + 1;
        }

        if (q.type === "mc") {
          const opts = cardsEl[i].querySelectorAll(".option");
          opts.forEach((o, j) => {
            o.onclick = null;
            if (j === q.answer) o.classList.add("correct");
            if (ans && ans.value === j && j !== q.answer) o.classList.add("wrong");
          });
        } else {
          const input = cardsEl[i].querySelector("input");
          input.disabled = true;
          if (isCorrect) {
            input.style.borderColor = "var(--success)";
          } else {
            input.style.borderColor = "var(--error)";
            input.placeholder = "正確：" + q.answer;
          }
        }
      });

      const percent = Math.round((correct / qs.length) * 100);
      data.quizHistory = data.quizHistory || [];
      data.quizHistory.push({ date: new Date().toISOString(), correct, total: qs.length, percent });
      // keep last 30
      if (data.quizHistory.length > 30) data.quizHistory = data.quizHistory.slice(-30);
      saveData(data);

      const result = document.getElementById("result");
      result.style.display = "block";
      result.innerHTML = `<div class="score">${correct} / ${qs.length}</div>
        <p style="margin-top:6px">正確率 ${percent}%</p>
        <p style="margin-top:6px;color:var(--muted)">${percent === 100 ? "太強了！全部答對" : "已記錄弱點，Flashcard 會優先出現相關卡片"}</p>`;

      document.getElementById("submit-btn").style.display = "none";
      document.getElementById("retry-btn").style.display = "inline-block";
      buildCardOrder(); // refresh priority
    }

    // Tabs
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.tab).classList.add("active");
      });
    });

    // Init
    buildCardOrder();
    showCard();
    startQuiz();
    updateStats();
  </script>
</body>
</html>
