<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>生活英文單字卡</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #1a2332;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #4ade80;
      --error: #f87171;
      --warning: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100%;
      padding: 12px;
      line-height: 1.45;
      overscroll-behavior-y: none;
    }
    .container { max-width: 430px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 10px; }
    h1 { font-size: 1.2rem; font-weight: 700; }
    .subtitle { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .stat-box {
      background: var(--card);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
    }
    .stat-box strong { display: block; font-size: 1.15rem; color: var(--accent); }
    .stat-box span { font-size: 0.7rem; color: var(--muted); }

    .tabs {
      display: flex;
      background: var(--card);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 10px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
    }
    .tab.active { background: var(--accent); color: #0f172a; }

    .panel { display: none; }
    .panel.active { display: block; }

    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      overflow-x: auto;
    }
    .filter-btn {
      flex-shrink: 0;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid #334155;
      background: transparent;
      color: var(--muted);
      font-size: 0.75rem;
    }
    .filter-btn.active { background: #334155; color: var(--text); border-color: var(--accent); }

    .swipe-hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .card-stage {
      position: relative;
      height: 400px;
      margin-bottom: 10px;
    }

    .flashcard {
      position: absolute;
      inset: 0;
      background: var(--card);
      border-radius: 18px;
      padding: 22px 16px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);
      transition: transform 0.25s ease, opacity 0.25s ease;
      touch-action: none;
      user-select: none;
      overflow-y: auto;
    }
    .flashcard.leaving-left {
      transform: translateX(-120%) rotate(-12deg);
      opacity: 0;
    }
    .flashcard.leaving-right {
      transform: translateX(120%) rotate(12deg);
      opacity: 0;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 0.66rem;
      padding: 3px 8px;
      border-radius: 20px;
      background: #334155;
    }
    .badge.weak { background: var(--error); color: #0f172a; }
    .badge.known { background: var(--success); color: #0f172a; }

    .swipe-indicator {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.95rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.1s;
    }
    .swipe-indicator.left { left: 12px; color: var(--error); }
    .swipe-indicator.right { right: 12px; color: var(--success); }

    .category { font-size: 0.7rem; color: var(--muted); margin-bottom: 4px; }
    .prompt { font-size: 1.45rem; font-weight: 700; margin-bottom: 12px; }

    .answer-input {
      width: 100%;
      max-width: 240px;
      padding: 12px;
      border-radius: 12px;
      border: 2px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 1.15rem;
      text-align: center;
      margin-bottom: 10px;
    }
    .answer-input:focus { outline: none; border-color: var(--accent); }
    .answer-input.correct { border-color: var(--success); }
    .answer-input.wrong { border-color: var(--error); }

    .result-area { width: 100%; display: none; text-align: left; }
    .result-area.show { display: block; }

    .correct-word {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 2px;
      color: var(--accent);
      cursor: pointer;
    }
    .syllable { font-size: 0.95rem; color: var(--muted); text-align: center; margin-bottom: 10px; letter-spacing: 1px; }

    .examples { margin: 4px 0 8px; }
    .ex-item { margin-bottom: 8px; }
    .ex-en {
      font-size: 0.84rem;
      color: var(--accent);
      cursor: pointer;
    }
    .ex-en:active { opacity: 0.7; }
    .ex-zh { font-size: 0.76rem; color: var(--muted); margin-top: 1px; }

    .native {
      margin-top: 6px;
      padding: 7px 10px;
      background: #0f172a;
      border-radius: 10px;
      font-size: 0.76rem;
      color: var(--warning);
      text-align: center;
    }
    .tap-hint {
      text-align: center;
      font-size: 0.66rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 11px 15px;
      border: none;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      background: var(--card);
      color: var(--text);
    }
    .btn.primary { background: var(--accent); color: #0f172a; }
    .btn.success { background: var(--success); color: #0f172a; }
    .btn.warning { background: var(--warning); color: #0f172a; }

    .progress-bar {
      height: 3px;
      background: #1e293b;
      border-radius: 3px;
      margin: 6px 0 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.25s;
    }
    .progress-text { text-align: center; font-size: 0.74rem; color: var(--muted); margin-bottom: 6px; }

    .question-card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .q-num { color: var(--muted); font-size: 0.72rem; margin-bottom: 4px; }
    .q-text { font-size: 0.95rem; margin-bottom: 8px; }
    .options { display: flex; flex-direction: column; gap: 6px; }
    .option {
      padding: 11px 12px;
      background: #243044;
      border-radius: 10px;
      font-size: 0.9rem;
    }
    .option.selected { background: var(--accent); color: #0f172a; }
    .option.correct { background: var(--success); color: #0f172a; }
    .option.wrong { background: var(--error); color: #0f172a; }
    .fill-input {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
    }
    .explain {
      margin-top: 8px;
      padding: 8px 10px;
      background: #0f172a;
      border-left: 3px solid var(--warning);
      border-radius: 0 8px 8px 0;
      font-size: 0.8rem;
      color: var(--muted);
      display: none;
    }
    .explain.show { display: block; }
    .result { margin-top: 12px; text-align: center; }
    .score { font-size: 1.7rem; font-weight: 700; color: var(--accent); }

    .weak-list {
      background: var(--card);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      font-size: 0.82rem;
    }
    .weak-list h3 { font-size: 0.85rem; margin-bottom: 5px; color: var(--warning); }

    footer { text-align: center; margin-top: 16px; color: var(--muted); font-size: 0.7rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>生活英文單字卡</h1>
      <p class="subtitle">餐廳・咖啡・旅遊・日常 · 點擊英文可發聲</p>
    </header>

    <div class="stats">
      <div class="stat-box"><strong id="stat-total">0</strong><span>總單字</span></div>
      <div class="stat-box"><strong id="stat-known">0</strong><span>已掌握</span></div>
      <div class="stat-box"><strong id="stat-weak">0</strong><span>需加強</span></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="flash">單字卡</button>
      <button class="tab" data-tab="quiz">情境練習</button>
    </div>

    <div id="flash" class="panel active">
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="weak">只看需加強</button>
        <button class="filter-btn" data-filter="new">只看未標記</button>
      </div>

      <div class="swipe-hint">← 左滑：還不熟　　右滑：已掌握 →</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-text" id="flash-progress">1 / 10</div>

      <div class="card-stage">
        <div class="swipe-indicator left" id="ind-left">還不熟</div>
        <div class="swipe-indicator right" id="ind-right">已掌握</div>
        <div class="flashcard" id="card">
          <div class="badge" id="card-badge"></div>
          <div class="category" id="front-cat"></div>
          <div class="prompt" id="front-prompt"></div>

          <input type="text" class="answer-input" id="user-answer" placeholder="輸入英文單字" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

          <div class="result-area" id="result-area">
            <div class="correct-word" id="correct-word"></div>
            <div class="syllable" id="syllable"></div>
            <div class="examples" id="examples"></div>
            <div class="native" id="native"></div>
            <div class="tap-hint">👆 點擊英文單字或例句可發聲</div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="btn" onclick="prevCard()">上一張</button>
        <button class="btn primary" onclick="checkAnswer()">檢查</button>
        <button class="btn warning" onclick="doMark('weak')">還不熟</button>
        <button class="btn success" onclick="doMark('known')">已掌握</button>
      </div>

      <div class="weak-list" id="weak-box" style="display:none">
        <h3>目前需加強（只顯示中文）</h3>
        <div id="weak-items"></div>
      </div>
    </div>

    <div id="quiz" class="panel">
      <div id="quiz-area"></div>
      <div class="controls" style="margin-top:12px">
        <button class="btn primary" id="submit-btn" onclick="submitQuiz()">提交答案</button>
        <button class="btn" id="retry-btn" style="display:none" onclick="startQuiz()">再練一次</button>
      </div>
      <div class="result" id="result" style="display:none"></div>
    </div>

    <footer>A2 生活實用單字 · 點擊英文可發聲</footer>
  </div>

  <script>
    const cards = [
      // 餐廳 Restaurant
      { id:"w1", category:"餐廳", prompt:"菜單", word:"menu", syllable:"men-u",
        examples:[
          {en:"Can I see the menu, please?", zh:"可以給我看菜單嗎？"},
          {en:"What's on the menu today?", zh:"今天菜單上有什麼？"},
          {en:"We looked at the menu before ordering.", zh:"我們點餐前先看了菜單。"}
        ], native:"母語人士也常說：Could I get a menu? / Menu, please." },
      { id:"w2", category:"餐廳", prompt:"推薦", word:"recommend", syllable:"re-com-mend",
        examples:[
          {en:"What do you recommend?", zh:"你推薦什麼？"},
          {en:"I recommend the pasta.", zh:"我推薦義大利麵。"},
          {en:"She recommended this restaurant to me.", zh:"她向我推薦這間餐廳。"}
        ], native:"母語人士也常說：What's good here? / What do you suggest?" },
      { id:"w3", category:"餐廳", prompt:"帳單", word:"bill", syllable:"bill",
        examples:[
          {en:"Can I have the bill, please?", zh:"可以給我帳單嗎？"},
          {en:"Could you bring the bill?", zh:"可以拿帳單過來嗎？"},
          {en:"We split the bill.", zh:"我們分開付帳。"}
        ], native:"美式常說：Can I get the check? / Check, please." },
      { id:"w4", category:"餐廳", prompt:"點餐 / 點菜", word:"order", syllable:"or-der",
        examples:[
          {en:"Are you ready to order?", zh:"準備好點餐了嗎？"},
          {en:"I'd like to order the chicken.", zh:"我想點雞肉。"},
          {en:"Can I order now?", zh:"我可以現在點餐嗎？"}
        ], native:"母語人士也常說：Can I get the... / I'll have the..." },
      { id:"w5", category:"餐廳", prompt:"預約（餐廳）", word:"reservation", syllable:"re-ser-va-tion",
        examples:[
          {en:"I have a reservation under Chan.", zh:"我有預約，名字是 Chan。"},
          {en:"I'd like to make a reservation for two.", zh:"我想預約兩位。"},
          {en:"Do you need a reservation?", zh:"需要預約嗎？"}
        ], native:"母語人士也常說：I booked a table under Chan." },
      { id:"w6", category:"餐廳", prompt:"素食的", word:"vegetarian", syllable:"veg-e-tar-i-an",
        examples:[
          {en:"Is this dish vegetarian?", zh:"這道菜是素的嗎？"},
          {en:"I'm vegetarian.", zh:"我吃素。"},
          {en:"Do you have any vegetarian options?", zh:"有素食選項嗎？"}
        ], native:"也可以說：Is this meat-free?" },

      // 咖啡 Cafe
      { id:"w7", category:"咖啡", prompt:"拿鐵", word:"latte", syllable:"lat-te",
        examples:[
          {en:"I'd like a latte, please.", zh:"我要一杯拿鐵，謝謝。"},
          {en:"Can I get an iced latte?", zh:"可以給我一杯冰拿鐵嗎？"},
          {en:"She ordered a latte to go.", zh:"她點了一杯外帶拿鐵。"}
        ], native:"母語人士也常說：Can I get a latte? / Latte, please." },
      { id:"w8", category:"咖啡", prompt:"外帶", word:"takeaway", syllable:"take-a-way",
        examples:[
          {en:"Is this for here or takeaway?", zh:"在這裡喝還是外帶？"},
          {en:"I'd like it takeaway, please.", zh:"我要外帶，謝謝。"},
          {en:"We got some takeaway food.", zh:"我們買了一些外帶食物。"}
        ], native:"美式常說：For here or to go?" },
      { id:"w9", category:"咖啡", prompt:"美式咖啡", word:"americano", syllable:"a-mer-i-ca-no",
        examples:[
          {en:"Can I get an americano?", zh:"可以給我一杯美式嗎？"},
          {en:"I'd like an iced americano.", zh:"我要冰美式。"},
          {en:"One americano to go, please.", zh:"外帶一杯美式，謝謝。"}
        ], native:"常簡稱：Americano, please." },
      { id:"w10", category:"咖啡", prompt:"糖", word:"sugar", syllable:"sug-ar",
        examples:[
          {en:"Would you like some sugar?", zh:"要加糖嗎？"},
          {en:"No sugar, please.", zh:"不要糖，謝謝。"},
          {en:"Can I have more sugar?", zh:"可以多給我一點糖嗎？"}
        ], native:"也可以說：With sugar / Without sugar." },

      // 旅遊 Travel
      { id:"w11", category:"旅遊", prompt:"行李", word:"luggage", syllable:"lug-gage",
        examples:[
          {en:"Where can I leave my luggage?", zh:"我可以把行李放哪裡？"},
          {en:"How many pieces of luggage do you have?", zh:"你有幾件行李？"},
          {en:"My luggage is still at the hotel.", zh:"我的行李還在飯店。"}
        ], native:"美式更常用 bags：Where can I leave my bags?" },
      { id:"w12", category:"旅遊", prompt:"方向（問路）", word:"directions", syllable:"di-rec-tions",
        examples:[
          {en:"Can you give me directions to the station?", zh:"可以告訴我去車站怎麼走嗎？"},
          {en:"I need directions to the airport.", zh:"我需要去機場的路線。"},
          {en:"He gave us clear directions.", zh:"他給了我們清楚的指示。"}
        ], native:"母語人士也常說：How do I get to the station?" },
      { id:"w13", category:"旅遊", prompt:"機場", word:"airport", syllable:"air-port",
        examples:[
          {en:"How do I get to the airport?", zh:"我要怎麼去機場？"},
          {en:"We arrived at the airport early.", zh:"我們很早到機場。"},
          {en:"Is there a bus to the airport?", zh:"有巴士去機場嗎？"}
        ], native:"常用：Which way to the airport?" },
      { id:"w14", category:"旅遊", prompt:"飯店 / 酒店", word:"hotel", syllable:"ho-tel",
        examples:[
          {en:"I'm staying at this hotel.", zh:"我住在這間飯店。"},
          {en:"Where is the nearest hotel?", zh:"最近的飯店在哪裡？"},
          {en:"Can you recommend a good hotel?", zh:"可以推薦一間好飯店嗎？"}
        ], native:"也可以說：Do you know a nice place to stay?" },
      { id:"w15", category:"旅遊", prompt:"機票 / 票", word:"ticket", syllable:"tick-et",
        examples:[
          {en:"Where can I buy a ticket?", zh:"我可以在哪裡買票？"},
          {en:"I lost my ticket.", zh:"我的票不見了。"},
          {en:"One ticket to the museum, please.", zh:"一張博物館門票，謝謝。"}
        ], native:"常用：A ticket to..., please." },
      { id:"w16", category:"旅遊", prompt:"登機", word:"boarding", syllable:"board-ing",
        examples:[
          {en:"Boarding starts at 3 pm.", zh:"下午三點開始登機。"},
          {en:"Where is the boarding gate?", zh:"登機門在哪裡？"},
          {en:"We are boarding now.", zh:"我們現在正在登機。"}
        ], native:"常用：What's the boarding time?" },

      // 日常 Daily
      { id:"w17", category:"日常", prompt:"有空的 / 可用的", word:"available", syllable:"a-vail-a-ble",
        examples:[
          {en:"Is this table available?", zh:"這張桌子有人坐嗎？"},
          {en:"Are you available tomorrow?", zh:"你明天有空嗎？"},
          {en:"The room is available from 3 pm.", zh:"房間下午三點後可以使用。"}
        ], native:"母語人士也常說：Is this table free?" },
      { id:"w18", category:"日常", prompt:"方便的", word:"convenient", syllable:"con-ven-ient",
        examples:[
          {en:"Is it convenient for you?", zh:"這樣對你方便嗎？"},
          {en:"This location is very convenient.", zh:"這個位置非常方便。"},
          {en:"What time is convenient for the meeting?", zh:"會議幾點比較方便？"}
        ], native:"母語人士也常說：Does that work for you?" },
      { id:"w19", category:"日常", prompt:"預約（一般）", word:"appointment", syllable:"ap-point-ment",
        examples:[
          {en:"I have an appointment at 3.", zh:"我三點有預約。"},
          {en:"I'd like to make an appointment.", zh:"我想預約。"},
          {en:"Can I change my appointment?", zh:"我可以改預約時間嗎？"}
        ], native:"看醫生常用 appointment，餐廳多用 reservation。" },
      { id:"w20", category:"日常", prompt:"收據", word:"receipt", syllable:"re-ceipt",
        examples:[
          {en:"Can I have a receipt, please?", zh:"可以給我收據嗎？"},
          {en:"I need the receipt for this.", zh:"我需要這個的收據。"},
          {en:"Keep your receipt.", zh:"保留你的收據。"}
        ], native:"常用：Receipt, please." },
      { id:"w21", category:"日常", prompt:"打折 / 折扣", word:"discount", syllable:"dis-count",
        examples:[
          {en:"Is there any discount?", zh:"有打折嗎？"},
          {en:"Do you have a student discount?", zh:"有學生折扣嗎？"},
          {en:"Everything is 20% discount.", zh:"全部打八折。"}
        ], native:"也可以說：Is this on sale?" },
      { id:"w22", category:"日常", prompt:"排隊", word:"queue", syllable:"queue",
        examples:[
          {en:"There's a long queue.", zh:"隊伍很長。"},
          {en:"Please join the queue.", zh:"請排隊。"},
          {en:"We waited in the queue for 20 minutes.", zh:"我們排了二十分鐘。"}
        ], native:"美式常用 line：There's a long line." },
      { id:"w23", category:"日常", prompt:"靠近的 / 附近的", word:"nearby", syllable:"near-by",
        examples:[
          {en:"Is there a convenience store nearby?", zh:"附近有便利店嗎？"},
          {en:"Is the station nearby?", zh:"車站近嗎？"},
          {en:"There's a good restaurant nearby.", zh:"附近有一間不錯的餐廳。"}
        ], native:"也可以說：Is there one near here?" },
      { id:"w24", category:"日常", prompt:"營業時間", word:"opening hours", syllable:"o-pen-ing hours",
        examples:[
          {en:"What are your opening hours?", zh:"你們的營業時間是？"},
          {en:"Are you open on Sundays?", zh:"你們星期日有開嗎？"},
          {en:"The opening hours are 9 to 6.", zh:"營業時間是早上九點到六點。"}
        ], native:"常用：What time do you open / close?" }
    ];

    const questions = [
      { id:"q1", type:"mc", q:"在餐廳想看菜單，最自然的說法是？", options:["Give me menu.","Can I see the menu, please?","I want the menu."], answer:1, point:"menu", explain:"禮貌又常用：Can I see the menu, please?" },
      { id:"q2", type:"fill", q:"想請店員推薦：What do you ______ ?", answer:"recommend", point:"recommend", explain:"拼法 re-com-mend（兩個 m）" },
      { id:"q3", type:"mc", q:"結帳時最常用的說法是？", options:["I want pay.","Can I have the bill, please?","Give me the money."], answer:1, point:"bill", explain:"Can I have the bill, please? 美式常用 check" },
      { id:"q4", type:"fill", q:"點一杯拿鐵：I'd like a ______, please.", answer:"latte", point:"latte", explain:"latte = 拿鐵" },
      { id:"q5", type:"mc", q:"店員問「在這裡喝還是外帶？」較自然的是？", options:["Here or takeaway?","Is this for here or takeaway?","You eat here?"], answer:1, point:"takeaway", explain:"Is this for here or takeaway? 美式：For here or to go?" },
      { id:"q6", type:"fill", q:"飯店報預約：I have a ______ under Chan.", answer:"reservation", point:"reservation", explain:"reservation = 預約/訂位" }
    ];

    const STORAGE_KEY = "dailyEnglishV4";
    function loadData() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { quizHistory:[], cardStatus:{}, weakPoints:{} }; }
      catch { return { quizHistory:[], cardStatus:{}, weakPoints:{} }; }
    }
    function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); updateStats(); }
    let data = loadData();

    let preferredVoice = null;
    function loadVoices() {
      const voices = speechSynthesis.getVoices();
      preferredVoice = voices.find(v => v.lang==="en-US" && /Google|Samantha|Susan|Natural|Premium/i.test(v.name))
        || voices.find(v => v.lang==="en-US") || voices.find(v => v.lang.startsWith("en")) || null;
    }
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speak(text) {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = "en-US";
      utt.rate = 0.82;
      if (preferredVoice) utt.voice = preferredVoice;
      speechSynthesis.speak(utt);
    }

    function updateStats() {
      const status = data.cardStatus || {};
      document.getElementById("stat-total").textContent = cards.length;
      document.getElementById("stat-known").textContent = Object.values(status).filter(s => s==="known").length;
      document.getElementById("stat-weak").textContent = Object.values(status).filter(s => s==="weak").length;

      const weaks = [];
      Object.entries(status).forEach(([id,s]) => {
        if (s==="weak") {
          const c = cards.find(x => x.id===id);
          if (c) weaks.push(c.prompt);
        }
      });
      const box = document.getElementById("weak-box");
      if (weaks.length) {
        box.style.display = "block";
        document.getElementById("weak-items").innerHTML = weaks.map(w => "• "+w).join("<br>");
      } else box.style.display = "none";
    }

    let filter = "all";
    let orderedCards = [];
    let current = 0;
    let isAnimating = false;

    function buildCardOrder() {
      let list = [...cards];
      if (filter==="weak") list = list.filter(c => (data.cardStatus||{})[c.id]==="weak");
      else if (filter==="new") list = list.filter(c => !(data.cardStatus||{})[c.id]);

      const weak=[], normal=[], known=[];
      list.forEach(c => {
        const s = (data.cardStatus||{})[c.id];
        if (s==="weak") weak.push(c);
        else if (s==="known") known.push(c);
        else normal.push(c);
      });
      const shuffle = a => a.sort(() => Math.random()-0.5);
      orderedCards = filter==="all" ? [...shuffle(weak), ...shuffle(normal), ...shuffle(known)] : shuffle(list);
      if (!orderedCards.length) orderedCards = [...cards];
      current = 0;
    }

    function showCard() {
      if (!orderedCards.length) buildCardOrder();
      const c = orderedCards[current];
      const card = document.getElementById("card");

      card.classList.remove("leaving-left", "leaving-right");
      card.style.transform = "";
      card.style.opacity = "1";
      card.style.background = "";

      document.getElementById("front-cat").textContent = c.category;
      document.getElementById("front-prompt").textContent = c.prompt;

      const input = document.getElementById("user-answer");
      input.value = "";
      input.className = "answer-input";
      input.disabled = false;
      document.getElementById("result-area").classList.remove("show");

      const pct = (current / Math.max(orderedCards.length,1)) * 100;
      document.getElementById("progress-fill").style.width = pct + "%";
      document.getElementById("flash-progress").textContent = (current+1) + " / " + orderedCards.length;

      const badge = document.getElementById("card-badge");
      const status = (data.cardStatus||{})[c.id];
      if (status==="weak") { badge.textContent="需加強"; badge.className="badge weak"; }
      else if (status==="known") { badge.textContent="已掌握"; badge.className="badge known"; }
      else { badge.textContent=""; badge.className="badge"; }

      document.getElementById("ind-left").style.opacity = 0;
      document.getElementById("ind-right").style.opacity = 0;

      isAnimating = false;
      setTimeout(() => input.focus(), 30);
    }

    function checkAnswer() {
      const c = orderedCards[current];
      const input = document.getElementById("user-answer");
      const userVal = input.value.trim().toLowerCase();
      if (!userVal) return;

      document.getElementById("correct-word").textContent = c.word;
      document.getElementById("syllable").textContent = c.syllable;

      document.getElementById("examples").innerHTML = c.examples.map((ex,i) =>
        `<div class="ex-item">
          <div class="ex-en" data-speak="${ex.en.replace(/"/g,"&quot;")}">${i+1}. ${ex.en}</div>
          <div class="ex-zh">${ex.zh}</div>
        </div>`
      ).join("");

      document.querySelectorAll(".ex-en").forEach(el => {
        el.addEventListener("click", () => speak(el.dataset.speak));
      });

      document.getElementById("native").textContent = c.native;
      document.getElementById("result-area").classList.add("show");

      speak(c.word);

      if (userVal === c.word.toLowerCase()) {
        input.className = "answer-input correct";
      } else {
        input.className = "answer-input wrong";
        data.cardStatus = data.cardStatus || {};
        data.cardStatus[c.id] = "weak";
        saveData(data);
      }
      input.disabled = true;
    }

    document.getElementById("correct-word").addEventListener("click", () => {
      const c = orderedCards[current];
      if (c) speak(c.word);
    });

    document.getElementById("user-answer").addEventListener("keydown", e => {
      if (e.key === "Enter") checkAnswer();
    });

    function nextCard() {
      current = (current + 1) % orderedCards.length;
      showCard();
    }
    function prevCard() {
      current = (current - 1 + orderedCards.length) % orderedCards.length;
      showCard();
    }

    function doMark(type) {
      if (isAnimating) return;
      isAnimating = true;
      const c = orderedCards[current];
      data.cardStatus = data.cardStatus || {};
      data.cardStatus[c.id] = type;
      saveData(data);

      const card = document.getElementById("card");
      card.classList.add(type === "weak" ? "leaving-left" : "leaving-right");

      setTimeout(() => {
        nextCard();
      }, 260);
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        filter = btn.dataset.filter;
        buildCardOrder();
        showCard();
      });
    });

    const cardEl = document.getElementById("card");
    let startX = 0, currentX = 0, dragging = false;

    function onStart(e) {
      if (isAnimating) return;
      dragging = true;
      startX = e.type.includes("mouse") ? e.clientX : e.touches[0].clientX;
      cardEl.style.transition = "none";
    }
    function onMove(e) {
      if (!dragging || isAnimating) return;
      currentX = (e.type.includes("mouse") ? e.clientX : e.touches[0].clientX) - startX;
      cardEl.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.04}deg)`;
      const abs = Math.abs(currentX);
      document.getElementById("ind-left").style.opacity = currentX < -40 ? Math.min(abs/120, 1) : 0;
      document.getElementById("ind-right").style.opacity = currentX > 40 ? Math.min(abs/120, 1) : 0;
    }
    function onEnd() {
      if (!dragging) return;
      dragging = false;
      cardEl.style.transition = "transform 0.25s ease, opacity 0.25s ease";

      if (currentX < -90) {
        doMark("weak");
      } else if (currentX > 90) {
        doMark("known");
      } else {
        cardEl.style.transform = "";
        document.getElementById("ind-left").style.opacity = 0;
        document.getElementById("ind-right").style.opacity = 0;
      }
      currentX = 0;
    }

    cardEl.addEventListener("touchstart", onStart, {passive:true});
    cardEl.addEventListener("touchmove", onMove, {passive:true});
    cardEl.addEventListener("touchend", onEnd);
    cardEl.addEventListener("mousedown", onStart);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onEnd);

    let userAnswers = [];
    function startQuiz() {
      userAnswers = [];
      const area = document.getElementById("quiz-area");
      area.innerHTML = "";
      document.getElementById("result").style.display = "none";
      document.getElementById("submit-btn").style.display = "inline-block";
      document.getElementById("retry-btn").style.display = "none";

      const sortedQ = [...questions].sort((a,b) => ((data.weakPoints||{})[b.point]||0)-((data.weakPoints||{})[a.point]||0));
      sortedQ.forEach((q,i) => {
        const div = document.createElement("div");
        div.className = "question-card";
        div.innerHTML = `<div class="q-num">第 ${i+1} 題</div><div class="q-text">${q.q}</div>`;
        if (q.type==="mc") {
          const opts = document.createElement("div"); opts.className="options";
          q.options.forEach((opt,j) => {
            const o = document.createElement("div"); o.className="option"; o.textContent=opt;
            o.onclick = () => { opts.querySelectorAll(".option").forEach(el=>el.classList.remove("selected")); o.classList.add("selected"); userAnswers[i]={value:j}; };
            opts.appendChild(o);
          });
          div.appendChild(opts);
        } else {
          const input = document.createElement("input"); input.className="fill-input"; input.placeholder="請輸入答案";
          input.oninput = e => userAnswers[i]={value:e.target.value.trim().toLowerCase()};
          div.appendChild(input);
        }
        const exp = document.createElement("div"); exp.className="explain"; exp.id="explain-"+i; exp.textContent=q.explain;
        div.appendChild(exp);
        area.appendChild(div);
      });
      window._currentQuestions = sortedQ;
    }

    function submitQuiz() {
      const qs = window._currentQuestions || questions;
      let correct = 0;
      const cardsEl = document.querySelectorAll(".question-card");
      qs.forEach((q,i) => {
        const ans = userAnswers[i];
        let isCorrect = q.type==="mc" ? (ans && ans.value===q.answer) : (ans && ans.value===q.answer.toLowerCase());
        if (isCorrect) correct++;
        else {
          data.weakPoints = data.weakPoints||{};
          data.weakPoints[q.point] = (data.weakPoints[q.point]||0)+1;
          const related = cards.find(c => c.word===q.point);
          if (related) { data.cardStatus=data.cardStatus||{}; data.cardStatus[related.id]="weak"; }
        }
        const expEl = document.getElementById("explain-"+i);
        if (expEl) { expEl.classList.add("show"); if (!isCorrect) expEl.style.borderColor="var(--error)"; }
        if (q.type==="mc") {
          cardsEl[i].querySelectorAll(".option").forEach((o,j) => {
            o.onclick=null;
            if (j===q.answer) o.classList.add("correct");
            if (ans && ans.value===j && j!==q.answer) o.classList.add("wrong");
          });
        } else {
          const input = cardsEl[i].querySelector("input"); input.disabled=true;
          if (isCorrect) input.style.borderColor="var(--success)";
          else { input.style.borderColor="var(--error)"; input.placeholder="正確："+q.answer; }
        }
      });
      const percent = Math.round((correct/qs.length)*100);
      data.quizHistory = data.quizHistory||[];
      data.quizHistory.push({date:new Date().toISOString(), correct, total:qs.length, percent});
      if (data.quizHistory.length>30) data.quizHistory=data.quizHistory.slice(-30);
      saveData(data);
      document.getElementById("result").style.display="block";
      document.getElementById("result").innerHTML = `<div class="score">${correct} / ${qs.length}</div><p style="margin-top:4px;color:var(--muted)">正確率 ${percent}%</p>`;
      document.getElementById("submit-btn").style.display="none";
      document.getElementById("retry-btn").style.display="inline-block";
      buildCardOrder();
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.tab).classList.add("active");
      });
    });

    buildCardOrder();
    showCard();
    startQuiz();
    updateStats();
  </script>
</body>
</html>
