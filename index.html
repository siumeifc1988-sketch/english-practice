<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="依 A1–B2 程度循序學習生活、旅行、餐廳與咖啡英文單字。">
  <title>生活英文單字庫｜循序學習</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1120;--panel:#121c2d;--raised:#19263a;--text:#f3f6fb;--muted:#a4b1c4;--accent:#73d5c2;--ink:#09241f;--line:#2a3a50;--good:#8de0ad;--bad:#ff9a9a;--warm:#ffd27b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% -10%,#1c3b48 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}button{font:inherit;color:inherit}button:focus-visible{outline:3px solid var(--warm);outline-offset:3px}.shell{width:min(900px,calc(100% - 28px));margin:auto;padding:24px 0 42px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:45px;height:45px;border-radius:14px;background:var(--accent);color:var(--ink);font-weight:900}.header h1{font-size:clamp(1.25rem,4vw,1.7rem);margin:0}.subtitle{margin:2px 0 0;color:var(--muted);font-size:.85rem}.count{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:7px 11px;color:var(--accent);font-size:.8rem}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}.panel{min-width:0;padding:clamp(16px,3vw,26px);border:1px solid var(--line);border-radius:19px;background:#121c2dee;box-shadow:0 16px 42px #0003}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}.level{min-height:61px;padding:8px;border:1px solid var(--line);border-radius:12px;background:#0e1726;text-align:left;cursor:pointer}.level strong,.level span{display:block}.level strong{font-size:.9rem}.level span{color:var(--muted);font-size:.7rem}.level.active{border-color:var(--accent);background:#173536}.level.active strong{color:var(--accent)}.level:disabled{opacity:.55;cursor:not-allowed}.level-progress{height:4px;margin-top:5px;border-radius:8px;background:#28374a;overflow:hidden}.level-progress i{display:block;height:100%;background:var(--accent)}.heading,.progress-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.heading h2{margin:0;font-size:1.1rem}.heading span,.progress-row{color:var(--muted);font-size:.78rem}.track{height:6px;margin:12px 0 6px;border-radius:9px;background:#27364a;overflow:hidden}.fill{height:100%;background:var(--accent);transition:width .2s}.card{min-height:270px;display:flex;flex-direction:column;justify-content:center;align-items:center;margin:18px 0 13px;padding:22px;border:1px solid #30445a;border-radius:20px;background:linear-gradient(145deg,#1a2a3e,#142033 70%);text-align:center}.category{color:var(--accent);font-size:.8rem}.meaning{margin:10px 0 16px;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.25}.word{margin:0;color:var(--accent);font-size:clamp(1.6rem,5vw,2.1rem)}.example{margin:14px 0 0}.translation{margin:3px 0 0;color:var(--muted);font-size:.86rem}.hint{min-height:24px;margin:12px 0 0;color:var(--muted);font-size:.83rem}.btn-row{display:flex;flex-wrap:wrap;gap:8px}.btn{flex:1;min-width:100px;min-height:47px;padding:10px 13px;border:1px solid var(--line);border-radius:12px;background:var(--raised);font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.primary{border-color:var(--accent);background:var(--accent);color:var(--ink)}.btn.review{background:#482b32;color:var(--bad)}.btn.known{background:#1b4435;color:var(--good)}.side h2{margin:0;font-size:1.05rem}.side p{color:var(--muted);font-size:.82rem}.unlock{padding:10px;margin-top:8px;border-radius:10px;background:var(--raised);font-size:.82rem}.unlock strong{color:var(--accent)}.word-list{display:grid;gap:6px;max-height:350px;overflow:auto}.word-row{display:flex;justify-content:space-between;gap:8px;padding:8px 9px;border-radius:9px;background:#0e1726;font-size:.78rem}.word-row span:last-child{color:var(--muted);text-align:right}.quiz{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.quiz summary{font-weight:750;cursor:pointer}.quiz-question{margin:12px 0;font-weight:650}.quiz-options{display:grid;gap:7px}.quiz-option{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0e1726;cursor:pointer}.quiz-option input{accent-color:var(--accent)}.quiz-feedback{text-align:center;color:var(--accent);font-size:.86rem}.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);padding:11px 15px;border:1px solid var(--line);border-radius:11px;background:var(--raised);box-shadow:0 10px 30px #0005}.toast[hidden]{display:none}footer{margin-top:18px;text-align:center;color:var(--muted);font-size:.76rem}
    @media(max-width:720px){.shell{width:min(620px,calc(100% - 22px));padding-top:17px}.layout{grid-template-columns:1fr}.side{order:2}.side .word-list{max-height:220px}}
    @media(max-width:420px){.header{align-items:flex-start}.count{font-size:.7rem;padding:6px 8px}.levels{grid-template-columns:repeat(2,1fr);gap:7px}.level{min-height:56px}.panel{padding:14px}.card{min-height:245px;padding:18px 14px}.btn-row{display:grid;grid-template-columns:1fr 1fr}.btn{min-width:0}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="header"><div class="brand"><div class="logo" aria-hidden="true">A+</div><div><h1>生活英文單字庫</h1><p class="subtitle">從常用單字開始，循序提升英文能力</p></div></div><div class="count"><span id="total">0</span> 個單字</div></header>
    <div class="layout">
      <section class="panel" aria-label="單字練習">
        <nav class="levels" id="levels" aria-label="英文程度"></nav>
        <div class="heading"><h2 id="level-heading"></h2><span>生活・旅行・餐廳・咖啡</span></div>
        <div class="track" role="progressbar" aria-label="本級掌握進度" aria-valuemin="0" aria-valuemax="100" id="progress"><div class="fill" id="fill"></div></div>
        <div class="progress-row"><span id="mastery"></span><span id="position"></span></div>
        <article class="card" aria-live="polite"><div class="category" id="category"></div><h2 class="meaning" id="meaning"></h2><div id="answer" hidden><h3 class="word" id="word"></h3><button class="btn" id="speak" type="button">🔊 聽發音</button><p class="example" id="example"></p><p class="translation" id="translation"></p></div><p class="hint" id="hint">先想想英文怎麼說，再顯示答案。</p></article>
        <div class="btn-row"><button class="btn" id="prev" type="button">← 上一個</button><button class="btn primary" id="reveal" type="button">顯示答案</button><button class="btn review" id="weak" type="button" disabled>再複習</button><button class="btn known" id="known" type="button" disabled>認識了</button><button class="btn" id="next" type="button">下一個 →</button></div>
        <details class="quiz"><summary>小測驗：測試本級單字</summary><div id="quiz"></div><div class="btn-row"><button class="btn primary" id="check-quiz" type="button">檢查答案</button><button class="btn" id="new-quiz" type="button">換一題</button></div><p class="quiz-feedback" id="quiz-feedback" aria-live="polite"></p></details>
      </section>
      <aside class="panel side"><h2>逐級解鎖</h2><p>每級 20 個單字。認識上一級至少 12 個，就能解鎖下一級。舊版的學習標記會保留。</p><div id="unlock-info"></div><h3>本級單字</h3><div class="word-list" id="word-list"></div></aside>
    </div>
    <footer>學習紀錄只儲存在這個裝置的瀏覽器。網站目前收錄的單字數會顯示在頁面上。</footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="data/words.js"></script>
  <script>
    "use strict";
    const LEVELS=[{id:"A1",name:"入門溝通",threshold:0},{id:"A2",name:"日常應用",threshold:12},{id:"B1",name:"獨立溝通",threshold:12},{id:"B2",name:"流暢表達",threshold:12}];
    const KEY="dailyEnglishV3", $=id=>document.getElementById(id); let data=loadData(), level="A1", cards=[], index=0, revealed=false, quizCard=null, toastTimer;
    function loadData(){try{const saved=JSON.parse(localStorage.getItem(KEY)||"null")||{};return{...saved,cardStatus:saved.cardStatus&&typeof saved.cardStatus==="object"?saved.cardStatus:{},weakPoints:saved.weakPoints&&typeof saved.weakPoints==="object"?saved.weakPoints:{},quizHistory:Array.isArray(saved.quizHistory)?saved.quizHistory:[]}}catch{return{cardStatus:{},weakPoints:{},quizHistory:[]}}}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{notify("無法儲存進度，請檢查瀏覽器設定。")}}
    function levelCards(id){return window.WORDS.filter(item=>item.level===id)}
    function mastered(id){return levelCards(id).filter(item=>data.cardStatus[item.id]==="known").length}
    function isUnlocked(id){const i=LEVELS.findIndex(item=>item.id===id);return i===0||mastered(LEVELS[i-1].id)>=LEVELS[i].threshold}
    function notify(message){const el=$("toast");el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2300)}
    function render(){cards=levelCards(level);if(!cards.length){$("meaning").textContent="這個級別目前沒有單字";return}index=Math.min(index,cards.length-1);renderLevels();renderCard();renderUnlockInfo();renderWordList();renderQuiz();$("total").textContent=window.WORDS.length}
    function renderLevels(){const host=$("levels");host.replaceChildren();LEVELS.forEach(item=>{const open=isUnlocked(item.id),count=levelCards(item.id).length;const button=document.createElement("button");button.type="button";button.className="level"+(level===item.id?" active":"");button.disabled=!open;button.innerHTML=`<strong>${item.id}${open?"":" 🔒"}</strong><span>${item.name} · ${mastered(item.id)}/${count}</span><div class="level-progress"><i style="width:${count?Math.round(mastered(item.id)/count*100):0}%"></i></div>`;button.addEventListener("click",()=>{level=item.id;index=0;render()});host.append(button)})}
    function renderCard(){const item=cards[index];const complete=mastered(level),pct=Math.round(complete/cards.length*100);$("level-heading").textContent=`${level} · ${LEVELS.find(x=>x.id===level).name}`;$("mastery").textContent=`已掌握 ${complete} / ${cards.length}`;$("position").textContent=`${index+1} / ${cards.length}`;$("fill").style.width=pct+"%";$("progress").setAttribute("aria-valuenow",pct);$("category").textContent=`${item.category||"日常"} · ${item.level}`;$("meaning").textContent=item.meaning;$("word").textContent=item.word;$("example").textContent=item.example;$("translation").textContent=item.translation;$("answer").hidden=true;$("hint").textContent="先想想英文怎麼說，再顯示答案。";$("reveal").hidden=false;$("weak").disabled=true;$("known").disabled=true;revealed=false}
    function reveal(){if(revealed)return;revealed=true;$("answer").hidden=false;$("hint").textContent="選擇「認識了」或「再複習」，記錄你的學習進度。";$("reveal").hidden=true;$("weak").disabled=false;$("known").disabled=false}
    function rate(status){if(!revealed){notify("先顯示答案再標記熟悉程度。");return}const before=LEVELS.map(item=>isUnlocked(item.id));data.cardStatus[cards[index].id]=status;save();if(status==="known"&&index<cards.length-1)index++;render();const unlocked=LEVELS.find((item,i)=>!before[i]&&isUnlocked(item.id));if(unlocked)notify(`恭喜，已解鎖 ${unlocked.id}！`);else notify(status==="known"?"已記錄為認識。":"已加入複習清單。")}
    function move(step){index=(index+step+cards.length)%cards.length;renderCard()}
    function renderUnlockInfo(){const host=$("unlock-info");host.replaceChildren();LEVELS.slice(1).forEach((item,i)=>{const prev=LEVELS[i].id,required=item.threshold,have=mastered(prev),box=document.createElement("div");box.className="unlock";const strong=document.createElement("strong");strong.textContent=`${item.id} · ${item.name}`;const detail=document.createElement("div");detail.textContent=isUnlocked(item.id)?"已解鎖，可以開始學習！":`在 ${prev} 再認識 ${Math.max(0,required-have)} 個單字即可解鎖`;box.append(strong,detail);host.append(box)})}
    function renderWordList(){const host=$("word-list");host.replaceChildren();cards.forEach((item,i)=>{const row=document.createElement("div");row.className="word-row";const left=document.createElement("span"),right=document.createElement("span");left.textContent=`${i+1}. ${item.word}`;right.textContent=item.meaning;row.append(left,right);host.append(row)})}
    function speak(){if(!("speechSynthesis"in window)){notify("此瀏覽器不支援語音播放。");return}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(cards[index].word);utterance.lang="en-US";utterance.rate=.86;speechSynthesis.speak(utterance)}
    function renderQuiz(){const host=$("quiz");host.replaceChildren();$("quiz-feedback").textContent="";quizCard=cards[Math.floor(Math.random()*cards.length)];const question=document.createElement("p");question.className="quiz-question";question.textContent=`「${quizCard.meaning}」的英文是？`;host.append(question);const pool=cards.filter(item=>item.id!==quizCard.id);const distractors=[];while(distractors.length<Math.min(3,pool.length)){const item=pool[Math.floor(Math.random()*pool.length)];if(!distractors.some(x=>x.id===item.id))distractors.push(item)}const options=[quizCard,...distractors].sort(()=>Math.random()-.5),list=document.createElement("div");list.className="quiz-options";options.forEach(item=>{const label=document.createElement("label");label.className="quiz-option";const input=document.createElement("input");input.type="radio";input.name="vocab-quiz";input.value=item.id;const text=document.createElement("span");text.textContent=item.word;label.append(input,text);list.append(label)});host.append(list)}
    function checkQuiz(){const selected=document.querySelector('input[name="vocab-quiz"]:checked');if(!selected){$("quiz-feedback").textContent="請先選一個答案。";return}const correct=selected.value===quizCard.id;$("quiz-feedback").textContent=correct?"答對了！太棒了。":`答案是 ${quizCard.word}，看一次例句再試試。`;data.weakPoints[quizCard.word]=Math.max(0,(data.weakPoints[quizCard.word]||0)+(correct?-1:1));if(!correct)data.cardStatus[quizCard.id]="weak";save();document.querySelectorAll('input[name="vocab-quiz"]').forEach(input=>input.disabled=true);renderLevels();renderUnlockInfo()}
    $("reveal").addEventListener("click",reveal);$("speak").addEventListener("click",speak);$("prev").addEventListener("click",()=>move(-1));$("next").addEventListener("click",()=>move(1));$("weak").addEventListener("click",()=>rate("weak"));$("known").addEventListener("click",()=>rate("known"));$("new-quiz").addEventListener("click",renderQuiz);$("check-quiz").addEventListener("click",checkQuiz);document.addEventListener("keydown",event=>{if(event.target instanceof HTMLInputElement)return;if(event.key==="ArrowLeft")move(-1);if(event.key==="ArrowRight")move(1);if(event.key==="Enter"&&!revealed)reveal()});
    if(!Array.isArray(window.WORDS)||window.WORDS.length===0){document.querySelector(".card").textContent="單字資料載入失敗，請重新整理頁面。"}else{render()}
  </script>
</body>
</html>
