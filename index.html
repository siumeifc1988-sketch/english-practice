<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>生活英文單字卡 | 主動回憶</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #4ade80;
      --error: #f87171;
      --warning: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      line-height: 1.5;
      touch-action: pan-y;
    }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin-bottom: 4px; text-align: center; }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 14px; font-size: 0.88rem; }

    .stats {
      background: var(--card);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      font-size: 0.82rem;
    }
    .stats div strong { display: block; font-size: 1.15rem; color: var(--accent); }

    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      flex: 1; padding: 11px; border: none; border-radius: 10px;
      background: var(--card); color: var(--text); font-size: 0.95rem; cursor: pointer;
    }
    .tab.active { background: var(--accent); color: #0f172a; font-weight: 600; }

    .panel { display: none; }
    .panel.active { display: block; }

    .swipe-hint {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .card-wrapper {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .flashcard {
      background: var(--card); border-radius: 16px; padding: 24px 18px;
      min-height: 320px; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      position: relative;
      transition: transform 0.2s ease, background 0.2s;
      touch-action: none;
      user-select: none;
    }
    .flashcard.dragging { transition: none; }
    .flashcard .label { position: absolute; top: 10px; left: 14px; font-size: 0.7rem; color: var(--muted); }
    .flashcard .badge {
      position: absolute; top: 10px; right: 14px; font-size: 0.68rem;
      padding: 2px 8px; border-radius: 20px; background: #334155;
    }
    .flashcard .badge.weak { background: var(--error); color: #0f172a; }

    .swipe-indicator {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      z-index: 5;
    }
    .swipe-indicator.left { left: 16px; color: var(--error); }
    .swipe-indicator.right { right: 16px; color: var(--success); }

    .category { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; }
    .prompt { font-size: 1.5rem; font-weight: 600; margin-bottom: 16px; }
    .answer-input {
      width: 100%; max-width: 280px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 1.2rem;
      text-align: center;
      margin-bottom: 12px;
    }
    .answer-input:focus { outline: none; border-color: var(--accent); }
    .answer-input.correct { border-color: var(--success); }
    .answer-input.wrong { border-color: var(--error); }

    .result-area { width: 100%; margin-top: 8px; display: none; text-align: left; }
    .result-area.show { display: block; }
    .correct-word { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; text-align: center; }
    .syllable { font-size: 1.1rem; color: var(--accent); margin-bottom: 10px; letter-spacing: 1px; text-align: center; }
    .examples { margin: 8px 0; }
    .examples .ex-item { margin-bottom: 10px; }
    .examples .ex-en { font-size: 0.9rem; color: var(--accent); }
    .examples .ex-zh { font-size: 0.82rem; color: var(--muted); margin-top: 2px; }
    .usage { font-size: 0.85rem; color: var(--muted); margin-top: 6px; text-align: center; }
    .native {
      margin-top: 10px;
      padding: 8px 12px;
      background: #1e293b;
      border-radius: 8px;
      font-size: 0.86rem;
      color: var(--warning);
      text-align: center;
    }

    .speak-btn {
      margin-top: 10px;
      padding: 8px 18px;
      border: none;
      border-radius: 20px;
      background: #334155;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .speak-btn:active { background: var(--accent); color: #0f172a; }

    .controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    button.btn {
      padding: 10px 14px; border: none; border-radius: 10px;
      font-size: 0.9rem; cursor: pointer; background: var(--card); color: var(--text);
    }
    button.btn.primary { background: var(--accent); color: #0f172a; font-weight: 600; }
    button.btn.success { background: var(--success); color: #0f172a; }
    button.btn.warning { background: var(--warning); color: #0f172a; }

    .progress { text-align: center; color: var(--muted); margin: 8px 0; font-size: 0.85rem; }

    .question-card {
      background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px;
    }
    .q-num { color: var(--muted); font-size: 0.78rem; margin-bottom: 6px; }
    .q-text { font-size: 1.05rem; margin-bottom: 10px; }
    .options { display: flex; flex-direction: column; gap: 7px; }
    .option {
      padding: 11px 14px; background: #334155; border-radius: 10px; cursor: pointer;
    }
    .option:hover { background: #475569; }
    .option.selected { background: var(--accent); color: #0f172a; }
    .option.correct { background: var(--success); color: #0f172a; }
    .option.wrong { background: var(--error); color: #0f172a; }
    .fill-input {
      width: 100%; padding: 11px; border-radius: 10px;
      border: 2px solid #334155; background: #0f172a; color: var(--text); font-size: 1rem;
    }
    .explain {
      margin-top: 10px;
      padding: 10px 12px;
      background: #1e293b;
      border-left: 3px solid var(--warning);
      border-radius: 0 8px 8px 0;
      font-size: 0.88rem;
      color: var(--muted);
      display: none;
    }
    .explain.show { display: block; }
    .result { margin-top: 16px; text-align: center; font-size: 1.05rem; }
    .score { font-size: 1.8rem; font-weight: 700; color: var(--accent); }

    .weak-list {
      background: var(--card); border-radius: 12px; padding: 12px 14px; margin-top: 14px;
      font-size: 0.85rem;
    }
    .weak-list h3 { font-size: 0.92rem; margin-bottom: 6px; color: var(--warning); }

    footer { text-align: center; margin-top: 28px; color: var(--muted); font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>生活英文單字卡</h1>
    <p class="subtitle">只看中文 → 輸入英文 · 三個例句（含中譯）</p>

    <div class="stats" id="stats">
      <div><strong id="stat-quizzes">0</strong>練習次數</div>
      <div><strong id="stat-avg">-</strong>平均正確率</div>
      <div><strong id="stat-weak">0</strong>需加強</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="flash">單字卡</button>
      <button class="tab" data-tab="quiz">情境練習</button>
    </div>

    <div id="flash" class="panel active">
      <div class="swipe-hint">← 左滑：還不熟　　右滑：已掌握 →</div>
      <div class="progress" id="flash-progress">1 / 10</div>

      <div class="card-wrapper">
        <div class="swipe-indicator left" id="ind-left">還不熟</div>
        <div class="swipe-indicator right" id="ind-right">已掌握</div>
        <div class="flashcard" id="card">
          <div class="label">輸入英文後按檢查 或 直接滑動</div>
          <div class="badge" id="card-badge"></div>

          <div class="category" id="front-cat"></div>
          <div class="prompt" id="front-prompt"></div>

          <input type="text" class="answer-input" id="user-answer" placeholder="輸入英文單字" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

          <div class="result-area" id="result-area">
            <div class="correct-word" id="correct-word"></div>
            <div class="syllable" id="syllable"></div>
            <div class="examples" id="examples"></div>
            <div class="usage" id="usage"></div>
            <div class="native" id="native"></div>
            <button class="speak-btn" onclick="speakWord()">🔊 讀音</button>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="btn" onclick="prevCard()">上一張</button>
        <button class="btn primary" onclick="checkAnswer()">檢查</button>
        <button class="btn warning" onclick="markWeak()">還不熟</button>
        <button class="btn success" onclick="markKnown()">已掌握</button>
        <button class="btn" onclick="nextCard()">下一張</button>
      </div>

      <div class="weak-list" id="weak-box" style="display:none">
        <h3>目前需加強的項目</h3>
        <div id="weak-items"></div>
      </div>
    </div>

    <div id="quiz" class="panel">
      <div id="quiz-area"></div>
      <div class="controls" style="margin-top:14px">
        <button class="btn primary" id="submit-btn" onclick="submitQuiz()">提交答案</button>
        <button class="btn" id="retry-btn" style="display:none" onclick="startQuiz()">再練一次</button>
      </div>
      <div class="result" id="result" style="display:none"></div>
    </div>

    <footer>三個例句含中譯 · 左滑不熟 · 右滑已掌握</footer>
  </div>

  <script>
    const cards = [
      {
        id: "w1", category: "餐廳", prompt: "菜單", word: "menu", syllable: "men-u",
        examples: [
          { en: "Can I see the menu, please?", zh: "可以給我看菜單嗎？" },
          { en: "What's on the menu today?", zh: "今天菜單上有什麼？" },
          { en: "We looked at the menu before ordering.", zh: "我們點餐前先看了菜單。" }
        ],
        usage: "點餐前常說",
        native: "母語人士也常說：Could I get a menu? / Menu, please."
      },
      {
        id: "w2", category: "餐廳", prompt: "推薦", word: "recommend", syllable: "re-com-mend",
        examples: [
          { en: "What do you recommend?", zh: "你推薦什麼？" },
          { en: "I recommend the pasta.", zh: "我推薦義大利麵。" },
          { en: "She recommended this restaurant to me.", zh: "她向我推薦這間餐廳。" }
        ],
        usage: "問店員推薦菜色（注意兩個 m）",
        native: "母語人士也常說：What's good here? / What do you suggest?"
      },
      {
        id: "w3", category: "餐廳", prompt: "帳單", word: "bill", syllable: "bill",
        examples: [
          { en: "Can I have the bill, please?", zh: "可以給我帳單嗎？" },
          { en: "Could you bring the bill?", zh: "可以拿帳單過來嗎？" },
          { en: "We split the bill.", zh: "我們分開付帳。" }
        ],
        usage: "結帳時使用",
        native: "美式常說：Can I get the check? / Check, please."
      },
      {
        id: "w4", category: "咖啡", prompt: "拿鐵", word: "latte", syllable: "lat-te",
        examples: [
          { en: "I'd like a latte, please.", zh: "我要一杯拿鐵，謝謝。" },
          { en: "Can I get an iced latte?", zh: "可以給我一杯冰拿鐵嗎？" },
          { en: "She ordered a latte to go.", zh: "她點了一杯外帶拿鐵。" }
        ],
        usage: "點咖啡常用",
        native: "母語人士也常說：Can I get a latte? / Latte, please."
      },
      {
        id: "w5", category: "咖啡", prompt: "外帶", word: "takeaway", syllable: "take-a-way",
        examples: [
          { en: "Is this for here or takeaway?", zh: "在這裡喝還是外帶？" },
          { en: "I'd like it takeaway, please.", zh: "我要外帶，謝謝。" },
          { en: "We got some takeaway food.", zh: "我們買了一些外帶食物。" }
        ],
        usage: "咖啡店常問的問題",
        native: "美式常說：For here or to go?"
      },
      {
        id: "w6", category: "旅遊", prompt: "預約 / 訂位", word: "reservation", syllable: "re-ser-va-tion",
        examples: [
          { en: "I have a reservation under Chan.", zh: "我有預約，名字是 Chan。" },
          { en: "I'd like to make a reservation for two.", zh: "我想預約兩位。" },
          { en: "Do you need a reservation?", zh: "需要預約嗎？" }
        ],
        usage: "飯店或餐廳報預約",
        native: "母語人士也常說：I booked a table under Chan. / Reservation for Chan."
      },
      {
        id: "w7", category: "旅遊", prompt: "行李", word: "luggage", syllable: "lug-gage",
        examples: [
          { en: "Where can I leave my luggage?", zh: "我可以把行李放哪裡？" },
          { en: "How many pieces of luggage do you have?", zh: "你有幾件行李？" },
          { en: "My luggage is still at the hotel.", zh: "我的行李還在飯店。" }
        ],
        usage: "不可數名詞，不能加 s",
        native: "美式更常用：bags / suitcase。Where can I leave my bags?"
      },
      {
        id: "w8", category: "旅遊", prompt: "方向（問路）", word: "directions", syllable: "di-rec-tions",
        examples: [
          { en: "Can you give me directions to the station?", zh: "可以告訴我去車站怎麼走嗎？" },
          { en: "I need directions to the airport.", zh: "我需要去機場的路線。" },
          { en: "He gave us clear directions.", zh: "他給了我們清楚的指示。" }
        ],
        usage: "問路時用複數",
        native: "母語人士也常說：How do I get to the station? / Which way is the station?"
      },
      {
        id: "w9", category: "日常", prompt: "有空的 / 可用的", word: "available", syllable: "a-vail-a-ble",
        examples: [
          { en: "Is this table available?", zh: "這張桌子有人坐嗎？" },
          { en: "Are you available tomorrow?", zh: "你明天有空嗎？" },
          { en: "The room is available from 3 pm.", zh: "房間下午三點後可以使用。" }
        ],
        usage: "問座位或時間是否有空",
        native: "母語人士也常說：Is this table free? / Is anyone sitting here?"
      },
      {
        id: "w10", category: "日常", prompt: "方便的", word: "convenient", syllable: "con-ven-ient",
        examples: [
          { en: "Is it convenient for you?", zh: "這樣對你方便嗎？" },
          { en: "This location is very convenient.", zh: "這個位置非常方便。" },
          { en: "What time is convenient for the meeting?", zh: "會議幾點比較方便？" }
        ],
        usage: "約時間或問是否方便",
        native: "母語人士也常說：Does that work for you? / Is that okay with you?"
      }
    ];

    const questions = [
      { id:"q1", type:"mc", q:"在餐廳想看菜單，最自然的說法是？", options:["Give me menu.","Can I see the menu, please?","I want the menu."], answer:1, point:"menu", explain:"禮貌又常用的說法是 Can I see the menu, please? 母語人士也常說 Could I get a menu?" },
      { id:"q2", type:"fill", q:"想請店員推薦：What do you ______ ?", answer:"recommend", point:"recommend", explain:"拼法是 re-com-mend（兩個 m）。母語人士也常說 What's good here?" },
      { id:"q3", type:"mc", q:"結帳時最常用的說法是？", options:["I want pay.","Can I have the bill, please?","Give me the money."], answer:1, point:"bill", explain:"Can I have the bill, please? 美式常說 Can I get the check?" },
      { id:"q4", type:"fill", q:"點一杯拿鐵：I'd like a ______, please.", answer:"latte", point:"latte", explain:"latte 就是拿鐵。也可以說 Can I get a latte?" },
      { id:"q5", type:"mc", q:"店員問「在這裡喝還是外帶？」較自然的是？", options:["Here or takeaway?","Is this for here or takeaway?","You eat here?"], answer:1, point:"takeaway", explain:"Is this for here or takeaway? 美式常說 For here or to go?" },
      { id:"q6", type:"fill", q:"飯店報預約：I have a ______ under Chan.", answer:"reservation", point:"reservation", explain:"reservation 是預約/訂位。也可以說 I booked a table under Chan." }
    ];

    const STORAGE_KEY = "dailyEnglishActiveRecall";

    function loadData() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { quizHistory: [], cardStatus: {}, weakPoints: {} }; }
      catch { return { quizHistory: [], cardStatus: {}, weakPoints: {} }; }
    }
    function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); updateStats(); }
    let data = loadData();

    let preferredVoice = null;
    function loadVoices() {
      const voices = speechSynthesis.getVoices();
      preferredVoice = voices.find(v => v.lang === "en-US" && /Google|Samantha|Susan|Natural|Premium/i.test(v.name))
        || voices.find(v => v.lang === "en-US") || voices.find(v => v.lang.startsWith("en")) || null;
    }
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function speakWord() {
      const c = orderedCards[current];
      if (!c || !window.speechSynthesis) return;
      speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(c.word);
      utt.lang = "en-US"; utt.rate = 0.8;
      if (preferredVoice) utt.voice = preferredVoice;
      speechSynthesis.speak(utt);
    }

    function updateStats() {
      const history = data.quizHistory || [];
      document.getElementById("stat-quizzes").textContent = history.length;
      document.getElementById("stat-avg").textContent = history.length ? Math.round(history.reduce((s,h)=>s+h.percent,0)/history.length)+"%" : "-";
      const weakCount = Object.values(data.cardStatus||{}).filter(s=>s==="weak").length;
      document.getElementById("stat-weak").textContent = weakCount;

      const weakBox = document.getElementById("weak-box");
      const weakItems = document.getElementById("weak-items");
      const weaks = [];
      Object.entries(data.cardStatus||{}).forEach(([id,status]) => {
        if (status === "weak") {
          const c = cards.find(x => x.id === id);
          if (c) weaks.push(c.prompt);
        }
      });
      if (weaks.length) {
        weakBox.style.display = "block";
        weakItems.innerHTML = weaks.map(w => "• " + w).join("<br>");
      } else weakBox.style.display = "none";
    }

    let orderedCards = [], current = 0;

    function buildCardOrder() {
      const weak=[], normal=[], known=[];
      cards.forEach(c => {
        const s = (data.cardStatus||{})[c.id];
        if (s==="weak") weak.push(c); else if (s==="known") known.push(c); else normal.push(c);
      });
      const shuffle = a => a.sort(() => Math.random()-0.5);
      orderedCards = [...shuffle(weak), ...shuffle(normal), ...shuffle(known)];
      current = 0;
    }

    function showCard() {
      if (!orderedCards.length) buildCardOrder();
      const c = orderedCards[current];
      document.getElementById("front-cat").textContent = c.category;
      document.getElementById("front-prompt").textContent = c.prompt;
      const input = document.getElementById("user-answer");
      input.value = ""; input.className = "answer-input"; input.disabled = false;
      document.getElementById("result-area").classList.remove("show");
      document.getElementById("flash-progress").textContent = (current+1) + " / " + orderedCards.length;

      const badge = document.getElementById("card-badge");
      const status = (data.cardStatus||{})[c.id];
      if (status==="weak") { badge.textContent="需加強"; badge.className="badge weak"; }
      else if (status==="known") { badge.textContent="已掌握"; badge.className="badge"; }
      else { badge.textContent=""; badge.className="badge"; }

      const card = document.getElementById("card");
      card.style.transform = "";
      card.style.background = "";
      document.getElementById("ind-left").style.opacity = 0;
      document.getElementById("ind-right").style.opacity = 0;
      input.focus();
    }

    function checkAnswer() {
      const c = orderedCards[current];
      const input = document.getElementById("user-answer");
      const userVal = input.value.trim().toLowerCase();
      if (!userVal) return;

      document.getElementById("correct-word").textContent = c.word;
      document.getElementById("syllable").textContent = c.syllable;
      document.getElementById("examples").innerHTML = c.examples.map((ex,i) =>
        `<div class="ex-item"><div class="ex-en">${i+1}. ${ex.en}</div><div class="ex-zh">${ex.zh}</div></div>`
      ).join("");
      document.getElementById("usage").textContent = c.usage;
      document.getElementById("native").textContent = c.native;
      document.getElementById("result-area").classList.add("show");

      if (userVal === c.word.toLowerCase()) input.className = "answer-input correct";
      else {
        input.className = "answer-input wrong";
        data.cardStatus = data.cardStatus || {};
        data.cardStatus[c.id] = "weak";
        saveData(data);
      }
      input.disabled = true;
    }

    document.getElementById("user-answer").addEventListener("keydown", e => { if (e.key==="Enter") checkAnswer(); });

    function nextCard() { current = (current+1) % orderedCards.length; showCard(); }
    function prevCard() { current = (current-1 + orderedCards.length) % orderedCards.length; showCard(); }

    function markWeak() {
      const c = orderedCards[current];
      data.cardStatus = data.cardStatus || {};
      data.cardStatus[c.id] = "weak";
      saveData(data);
      nextCard();
    }
    function markKnown() {
      const c = orderedCards[current];
      data.cardStatus = data.cardStatus || {};
      data.cardStatus[c.id] = "known";
      saveData(data);
      nextCard();
    }

    // Swipe
    const cardEl = document.getElementById("card");
    let startX = 0, currentX = 0, isDragging = false;

    function onStart(e) {
      isDragging = true;
      startX = e.type.includes("mouse") ? e.clientX : e.touches[0].clientX;
      cardEl.classList.add("dragging");
    }
    function onMove(e) {
      if (!isDragging) return;
      currentX = (e.type.includes("mouse") ? e.clientX : e.touches[0].clientX) - startX;
      cardEl.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.03}deg)`;
      const abs = Math.abs(currentX);
      document.getElementById("ind-left").style.opacity = currentX < -30 ? Math.min(abs/100, 1) : 0;
      document.getElementById("ind-right").style.opacity = currentX > 30 ? Math.min(abs/100, 1) : 0;
      if (currentX < -50) cardEl.style.background = "#3f1f1f";
      else if (currentX > 50) cardEl.style.background = "#1f3f2a";
      else cardEl.style.background = "";
    }
    function onEnd() {
      if (!isDragging) return;
      isDragging = false;
      cardEl.classList.remove("dragging");
      if (currentX < -80) {
        cardEl.style.transform = "translateX(-120%) rotate(-15deg)";
        setTimeout(() => markWeak(), 200);
      } else if (currentX > 80) {
        cardEl.style.transform = "translateX(120%) rotate(15deg)";
        setTimeout(() => markKnown(), 200);
      } else {
        cardEl.style.transform = "";
        cardEl.style.background = "";
        document.getElementById("ind-left").style.opacity = 0;
        document.getElementById("ind-right").style.opacity = 0;
      }
      currentX = 0;
    }

    cardEl.addEventListener("touchstart", onStart, {passive:true});
    cardEl.addEventListener("touchmove", onMove, {passive:true});
    cardEl.addEventListener("touchend", onEnd);
    cardEl.addEventListener("mousedown", onStart);
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onEnd);

    // Quiz
    let userAnswers = [];
    function startQuiz() {
      userAnswers = [];
      const area = document.getElementById("quiz-area");
      area.innerHTML = "";
      document.getElementById("result").style.display = "none";
      document.getElementById("submit-btn").style.display = "inline-block";
      document.getElementById("retry-btn").style.display = "none";

      const sortedQ = [...questions].sort((a,b) => ((data.weakPoints||{})[b.point]||0) - ((data.weakPoints||{})[a.point]||0));
      sortedQ.forEach((q,i) => {
        const div = document.createElement("div");
        div.className = "question-card";
        div.innerHTML = `<div class="q-num">第 ${i+1} 題</div><div class="q-text">${q.q}</div>`;
        if (q.type==="mc") {
          const opts = document.createElement("div"); opts.className="options";
          q.options.forEach((opt,j) => {
            const o = document.createElement("div"); o.className="option"; o.textContent=opt;
            o.onclick = () => { opts.querySelectorAll(".option").forEach(el=>el.classList.remove("selected")); o.classList.add("selected"); userAnswers[i]={value:j}; };
            opts.appendChild(o);
          });
          div.appendChild(opts);
        } else {
          const input = document.createElement("input"); input.className="fill-input"; input.placeholder="請輸入答案";
          input.oninput = e => userAnswers[i]={value:e.target.value.trim().toLowerCase()};
          div.appendChild(input);
        }
        const exp = document.createElement("div"); exp.className="explain"; exp.id="explain-"+i; exp.textContent=q.explain;
        div.appendChild(exp);
        area.appendChild(div);
      });
      window._currentQuestions = sortedQ;
    }

    function submitQuiz() {
      const qs = window._currentQuestions || questions;
      let correct = 0;
      const cardsEl = document.querySelectorAll(".question-card");
      qs.forEach((q,i) => {
        const ans = userAnswers[i];
        let isCorrect = q.type==="mc" ? (ans && ans.value===q.answer) : (ans && ans.value===q.answer.toLowerCase());
        if (isCorrect) correct++;
        else {
          data.weakPoints = data.weakPoints||{};
          data.weakPoints[q.point] = (data.weakPoints[q.point]||0)+1;
          const related = cards.find(c => c.word===q.point || c.word===q.point+"s");
          if (related) { data.cardStatus=data.cardStatus||{}; data.cardStatus[related.id]="weak"; }
        }
        const expEl = document.getElementById("explain-"+i);
        if (expEl) { expEl.classList.add("show"); if (!isCorrect) expEl.style.borderColor="var(--error)"; }
        if (q.type==="mc") {
          cardsEl[i].querySelectorAll(".option").forEach((o,j) => {
            o.onclick=null;
            if (j===q.answer) o.classList.add("correct");
            if (ans && ans.value===j && j!==q.answer) o.classList.add("wrong");
          });
        } else {
          const input = cardsEl[i].querySelector("input"); input.disabled=true;
          if (isCorrect) input.style.borderColor="var(--success)";
          else { input.style.borderColor="var(--error)"; input.placeholder="正確答案："+q.answer; }
        }
      });
      const percent = Math.round((correct/qs.length)*100);
      data.quizHistory = data.quizHistory||[];
      data.quizHistory.push({date:new Date().toISOString(), correct, total:qs.length, percent});
      if (data.quizHistory.length>30) data.quizHistory = data.quizHistory.slice(-30);
      saveData(data);
      document.getElementById("result").style.display="block";
      document.getElementById("result").innerHTML = `<div class="score">${correct} / ${qs.length}</div><p style="margin-top:6px">正確率 ${percent}%</p>`;
      document.getElementById("submit-btn").style.display="none";
      document.getElementById("retry-btn").style.display="inline-block";
      buildCardOrder();
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.tab).classList.add("active");
      });
    });

    buildCardOrder();
    showCard();
    startQuiz();
    updateStats();
  </script>
</body>
</html>
