<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生活英文練習 | 餐廳・咖啡・旅遊</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #4ade80;
      --error: #f87171;
      --warning: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      line-height: 1.5;
    }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin-bottom: 4px; text-align: center; }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 14px; font-size: 0.88rem; }

    .stats {
      background: var(--card);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      font-size: 0.82rem;
    }
    .stats div strong { display: block; font-size: 1.15rem; color: var(--accent); }

    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      flex: 1; padding: 11px; border: none; border-radius: 10px;
      background: var(--card); color: var(--text); font-size: 0.95rem; cursor: pointer;
    }
    .tab.active { background: var(--accent); color: #0f172a; font-weight: 600; }

    .panel { display: none; }
    .panel.active { display: block; }

    .flashcard {
      background: var(--card); border-radius: 16px; padding: 22px 16px;
      min-height: 250px; display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      margin-bottom: 12px; position: relative;
    }
    .flashcard .label { position: absolute; top: 10px; left: 14px; font-size: 0.7rem; color: var(--muted); }
    .flashcard .badge {
      position: absolute; top: 10px; right: 14px; font-size: 0.68rem;
      padding: 2px 8px; border-radius: 20px; background: #334155;
    }
    .flashcard .badge.weak { background: var(--error); color: #0f172a; }
    .flashcard .front, .flashcard .back { width: 100%; }
    .flashcard .back { display: none; }
    .flashcard.flipped .front { display: none; }
    .flashcard.flipped .back { display: block; }

    .category { font-size: 0.75rem; color: var(--muted); margin-bottom: 4px; }
    .word { font-size: 1.85rem; font-weight: 700; letter-spacing: 0.3px; margin-bottom: 4px; }
    .ipa { font-size: 1.05rem; color: var(--accent); margin-bottom: 6px; }
    .meaning { font-size: 1.1rem; margin: 6px 0; }
    .spelling { font-size: 0.88rem; color: var(--muted); margin-top: 6px; }
    .example { font-size: 0.9rem; color: var(--accent); margin-top: 8px; font-style: italic; }
    .usage { font-size: 0.85rem; color: var(--muted); margin-top: 6px; }

    .speak-btn {
      margin-top: 10px;
      padding: 8px 18px;
      border: none;
      border-radius: 20px;
      background: #334155;
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .speak-btn:active { background: var(--accent); color: #0f172a; }

    .controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
    button.btn {
      padding: 10px 14px; border: none; border-radius: 10px;
      font-size: 0.9rem; cursor: pointer; background: var(--card); color: var(--text);
    }
    button.btn.primary { background: var(--accent); color: #0f172a; font-weight: 600; }
    button.btn.success { background: var(--success); color: #0f172a; }
    button.btn.warning { background: var(--warning); color: #0f172a; }

    .progress { text-align: center; color: var(--muted); margin: 8px 0; font-size: 0.85rem; }

    .question-card {
      background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px;
    }
    .q-num { color: var(--muted); font-size: 0.78rem; margin-bottom: 6px; }
    .q-text { font-size: 1.05rem; margin-bottom: 10px; }
    .options { display: flex; flex-direction: column; gap: 7px; }
    .option {
      padding: 11px 14px; background: #334155; border-radius: 10px; cursor: pointer;
    }
    .option:hover { background: #475569; }
    .option.selected { background: var(--accent); color: #0f172a; }
    .option.correct { background: var(--success); color: #0f172a; }
    .option.wrong { background: var(--error); color: #0f172a; }
    .fill-input {
      width: 100%; padding: 11px; border-radius: 10px;
      border: 2px solid #334155; background: #0f172a; color: var(--text); font-size: 1rem;
    }
    .explain {
      margin-top: 10px;
      padding: 10px 12px;
      background: #1e293b;
      border-left: 3px solid var(--warning);
      border-radius: 0 8px 8px 0;
      font-size: 0.88rem;
      color: var(--muted);
      display: none;
    }
    .explain.show { display: block; }
    .result { margin-top: 16px; text-align: center; font-size: 1.05rem; }
    .score { font-size: 1.8rem; font-weight: 700; color: var(--accent); }

    .weak-list {
      background: var(--card); border-radius: 12px; padding: 12px 14px; margin-top: 14px;
      font-size: 0.85rem;
    }
    .weak-list h3 { font-size: 0.92rem; margin-bottom: 6px; color: var(--warning); }

    footer { text-align: center; margin-top: 28px; color: var(--muted); font-size: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>生活英文練習</h1>
    <p class="subtitle">餐廳・咖啡・旅遊・日常應用</p>

    <div class="stats" id="stats">
      <div><strong id="stat-quizzes">0</strong>練習次數</div>
      <div><strong id="stat-avg">-</strong>平均正確率</div>
      <div><strong id="stat-weak">0</strong>需加強</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="flash">單字卡</button>
      <button class="tab" data-tab="quiz">情境練習</button>
    </div>

    <!-- Flashcard -->
    <div id="flash" class="panel active">
      <div class="progress" id="flash-progress">1 / 10</div>
      <div class="flashcard" id="card" onclick="flipCard()">
        <div class="label">點擊翻面</div>
        <div class="badge" id="card-badge"></div>
        <div class="front">
          <div class="category" id="front-cat"></div>
          <div class="word" id="front-word"></div>
          <div class="ipa" id="front-ipa"></div>
          <button class="speak-btn" onclick="event.stopPropagation(); speakWord()">🔊 讀音</button>
        </div>
        <div class="back">
          <div class="word" id="back-word"></div>
          <div class="ipa" id="back-ipa"></div>
          <div class="meaning" id="back-meaning"></div>
          <div class="spelling" id="back-spelling"></div>
          <div class="example" id="back-example"></div>
          <div class="usage" id="back-usage"></div>
          <button class="speak-btn" onclick="event.stopPropagation(); speakWord()">🔊 再聽一次</button>
        </div>
      </div>
      <div class="controls">
        <button class="btn" onclick="prevCard()">上一張</button>
        <button class="btn warning" onclick="markWeak()">還不熟</button>
        <button class="btn success" onclick="markKnown()">已掌握</button>
        <button class="btn primary" onclick="nextCard()">下一張</button>
      </div>
      <div class="weak-list" id="weak-box" style="display:none">
        <h3>目前需加強的單字</h3>
        <div id="weak-items"></div>
      </div>
    </div>

    <!-- Quiz -->
    <div id="quiz" class="panel">
      <div id="quiz-area"></div>
      <div class="controls" style="margin-top:14px">
        <button class="btn primary" id="submit-btn" onclick="submitQuiz()">提交答案</button>
        <button class="btn" id="retry-btn" style="display:none" onclick="startQuiz()">再練一次</button>
      </div>
      <div class="result" id="result" style="display:none"></div>
    </div>

    <footer>讀音使用瀏覽器語音 · 若聲音怪異可換瀏覽器試試（Chrome 通常較自然）</footer>
  </div>

  <script>
    // Practical daily vocabulary
    const cards = [
      {
        id: "w1",
        category: "餐廳 Restaurant",
        word: "menu",
        ipa: "/ˈmenjuː/",
        meaning: "菜單",
        spelling: "men-u",
        example: "Can I see the menu, please?",
        usage: "點餐前常說的句子"
      },
      {
        id: "w2",
        category: "餐廳 Restaurant",
        word: "recommend",
        ipa: "/ˌrekəˈmend/",
        meaning: "推薦",
        spelling: "兩個 m：re-commend",
        example: "What do you recommend?",
        usage: "問店員推薦菜色"
      },
      {
        id: "w3",
        category: "餐廳 Restaurant",
        word: "bill",
        ipa: "/bɪl/",
        meaning: "帳單（美式也常用 check）",
        spelling: "簡單拼法",
        example: "Can I have the bill, please?",
        usage: "結帳時使用"
      },
      {
        id: "w4",
        category: "咖啡 Cafe",
        word: "latte",
        ipa: "/ˈlɑːteɪ/",
        meaning: "拿鐵",
        spelling: "lat-te",
        example: "I'd like a latte, please.",
        usage: "點咖啡常用"
      },
      {
        id: "w5",
        category: "咖啡 Cafe",
        word: "takeaway",
        ipa: "/ˈteɪkəweɪ/",
        meaning: "外帶（美式 to go）",
        spelling: "take-away",
        example: "Is this for here or takeaway?",
        usage: "店員常問的問題"
      },
      {
        id: "w6",
        category: "旅遊 Travel",
        word: "reservation",
        ipa: "/ˌrezəˈveɪʃn/",
        meaning: "預約、訂位",
        spelling: "re-ser-va-tion",
        example: "I have a reservation under Kim.",
        usage: "飯店或餐廳報預約名字"
      },
      {
        id: "w7",
        category: "旅遊 Travel",
        word: "luggage",
        ipa: "/ˈlʌɡɪdʒ/",
        meaning: "行李（不可數）",
        spelling: "lug-gage（兩個 g）",
        example: "Where can I leave my luggage?",
        usage: "機場或飯店問行李"
      },
      {
        id: "w8",
        category: "旅遊 Travel",
        word: "direction",
        ipa: "/dəˈrekʃn/",
        meaning: "方向",
        spelling: "di-rec-tion",
        example: "Can you give me directions to the station?",
        usage: "問路時使用"
      },
      {
        id: "w9",
        category: "日常 Daily",
        word: "available",
        ipa: "/əˈveɪləbl/",
        meaning: "有空的、可用的",
        spelling: "a-vail-able",
        example: "Is this table available?",
        usage: "問座位或時間是否有空"
      },
      {
        id: "w10",
        category: "日常 Daily",
        word: "convenient",
        ipa: "/kənˈviːniənt/",
        meaning: "方便的",
        spelling: "con-ven-ient",
        example: "Is it convenient for you to meet tomorrow?",
        usage: "約時間或問地點是否方便"
      }
    ];

    const questions = [
      {
        id: "q1",
        type: "mc",
        q: "在餐廳想看菜單，最自然的說法是？",
        options: ["Give me menu.", "Can I see the menu, please?", "I want menu."],
        answer: 1,
        point: "menu",
        explain: "禮貌又常用的說法是 Can I see the menu, please?"
      },
      {
        id: "q2",
        type: "fill",
        q: "想請店員推薦：What do you ______ ?",
        answer: "recommend",
        point: "recommend",
        explain: "問推薦用 recommend。"
      },
      {
        id: "q3",
        type: "mc",
        q: "結帳時怎麼說？",
        options: ["I want pay.", "Can I have the bill, please?", "Give me money."],
        answer: 1,
        point: "bill",
        explain: "Can I have the bill, please? 是最常見的結帳說法（美式也可用 check）。"
      },
      {
        id: "q4",
        type: "fill",
        q: "點一杯拿鐵：I'd like a ______, please.",
        answer: "latte",
        point: "latte",
        explain: "latte 就是拿鐵。"
      },
      {
        id: "q5",
        type: "mc",
        q: "店員問「在這裡喝還是外帶？」較自然的英文是？",
        options: ["Here or takeaway?", "Is this for here or takeaway?", "You eat here?"],
        answer: 1,
        point: "takeaway",
        explain: "Is this for here or takeaway? 是咖啡店超常用句。"
      },
      {
        id: "q6",
        type: "fill",
        q: "飯店報預約：I have a ______ under Chen.",
        answer: "reservation",
        point: "reservation",
        explain: "reservation 是預約/訂位。"
      },
      {
        id: "q7",
        type: "mc",
        q: "「行李」正確說法是？",
        options: ["luggages", "luggage", "luggags"],
        answer: 1,
        point: "luggage",
        explain: "luggage 是不可數名詞，不能加 s。"
      },
      {
        id: "q8",
        type: "fill",
        q: "問路：Can you give me ______ to the station?",
        answer: "directions",
        point: "direction",
        explain: "directions（複數）表示「怎麼走」。"
      }
    ];

    // Storage
    const STORAGE_KEY = "dailyEnglishData";

    function loadData() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { quizHistory: [], cardStatus: {}, weakPoints: {} };
      } catch {
        return { quizHistory: [], cardStatus: {}, weakPoints: {} };
      }
    }

    function saveData(d) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
      updateStats();
    }

    let data = loadData();

    // Better voice selection
    let preferredVoice = null;

    function loadVoices() {
      const voices = speechSynthesis.getVoices();
      // Prefer clear English voices
      preferredVoice = voices.find(v => v.lang === "en-US" && /Google|Samantha|Susan|Natural|Premium/i.test(v.name))
        || voices.find(v => v.lang === "en-US" && v.localService)
        || voices.find(v => v.lang.startsWith("en"))
        || null;
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }
    loadVoices();

    function speakWord() {
      const c = orderedCards[current];
      if (!c || !window.speechSynthesis) return;
      speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(c.word);
      utt.lang = "en-US";
      utt.rate = 0.8;
      utt.pitch = 1;
      if (preferredVoice) utt.voice = preferredVoice;
      speechSynthesis.speak(utt);
    }

    // Stats
    function updateStats() {
      const history = data.quizHistory || [];
      document.getElementById("stat-quizzes").textContent = history.length;
      if (history.length) {
        const avg = Math.round(history.reduce((s, h) => s + h.percent, 0) / history.length);
        document.getElementById("stat-avg").textContent = avg + "%";
      } else {
        document.getElementById("stat-avg").textContent = "-";
      }
      const weakCount = Object.values(data.cardStatus || {}).filter(s => s === "weak").length;
      document.getElementById("stat-weak").textContent = weakCount;

      const weakBox = document.getElementById("weak-box");
      const weakItems = document.getElementById("weak-items");
      const weaks = [];
      Object.entries(data.cardStatus || {}).forEach(([id, status]) => {
        if (status === "weak") {
          const c = cards.find(x => x.id === id);
          if (c) weaks.push(c.word + "（" + c.meaning + "）");
        }
      });
      if (weaks.length) {
        weakBox.style.display = "block";
        weakItems.innerHTML = weaks.map(w => "• " + w).join("<br>");
      } else {
        weakBox.style.display = "none";
      }
    }

    // Flashcard
    let orderedCards = [];
    let current = 0;

    function buildCardOrder() {
      const weak = [], normal = [], known = [];
      cards.forEach(c => {
        const s = (data.cardStatus || {})[c.id];
        if (s === "weak") weak.push(c);
        else if (s === "known") known.push(c);
        else normal.push(c);
      });
      const shuffle = a => a.sort(() => Math.random() - 0.5);
      orderedCards = [...shuffle(weak), ...shuffle(normal), ...shuffle(known)];
      current = 0;
    }

    function showCard() {
      if (!orderedCards.length) buildCardOrder();
      const c = orderedCards[current];
      document.getElementById("front-cat").textContent = c.category;
      document.getElementById("front-word").textContent = c.word;
      document.getElementById("front-ipa").textContent = c.ipa;
      document.getElementById("back-word").textContent = c.word;
      document.getElementById("back-ipa").textContent = c.ipa;
      document.getElementById("back-meaning").textContent = c.meaning;
      document.getElementById("back-spelling").textContent = "拼法：" + c.spelling;
      document.getElementById("back-example").textContent = "例句：" + c.example;
      document.getElementById("back-usage").textContent = c.usage;
      document.getElementById("flash-progress").textContent = (current + 1) + " / " + orderedCards.length;

      const badge = document.getElementById("card-badge");
      const status = (data.cardStatus || {})[c.id];
      if (status === "weak") {
        badge.textContent = "需加強";
        badge.className = "badge weak";
      } else if (status === "known") {
        badge.textContent = "已掌握";
        badge.className = "badge";
      } else {
        badge.textContent = "";
        badge.className = "badge";
      }
      document.getElementById("card").classList.remove("flipped");
    }

    function flipCard() {
      document.getElementById("card").classList.toggle("flipped");
    }

    function nextCard() {
      current = (current + 1) % orderedCards.length;
      showCard();
    }

    function prevCard() {
      current = (current - 1 + orderedCards.length) % orderedCards.length;
      showCard();
    }

    function markWeak() {
      const c = orderedCards[current];
      data.cardStatus = data.cardStatus || {};
      data.cardStatus[c.id] = "weak";
      saveData(data);
      showCard();
    }

    function markKnown() {
      const c = orderedCards[current];
      data.cardStatus = data.cardStatus || {};
      data.cardStatus[c.id] = "known";
      saveData(data);
      showCard();
    }

    // Quiz
    let userAnswers = [];

    function startQuiz() {
      userAnswers = [];
      const area = document.getElementById("quiz-area");
      area.innerHTML = "";
      document.getElementById("result").style.display = "none";
      document.getElementById("submit-btn").style.display = "inline-block";
      document.getElementById("retry-btn").style.display = "none";

      const sortedQ = [...questions].sort((a, b) => {
        const wa = (data.weakPoints || {})[a.point] || 0;
        const wb = (data.weakPoints || {})[b.point] || 0;
        return wb - wa;
      });

      sortedQ.forEach((q, i) => {
        const div = document.createElement("div");
        div.className = "question-card";
        div.innerHTML = `<div class="q-num">第 ${i + 1} 題</div><div class="q-text">${q.q}</div>`;

        if (q.type === "mc") {
          const opts = document.createElement("div");
          opts.className = "options";
          q.options.forEach((opt, j) => {
            const o = document.createElement("div");
            o.className = "option";
            o.textContent = opt;
            o.onclick = () => {
              opts.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
              o.classList.add("selected");
              userAnswers[i] = { value: j };
            };
            opts.appendChild(o);
          });
          div.appendChild(opts);
        } else {
          const input = document.createElement("input");
          input.className = "fill-input";
          input.placeholder = "請輸入答案";
          input.oninput = (e) => userAnswers[i] = { value: e.target.value.trim().toLowerCase() };
          div.appendChild(input);
        }

        const exp = document.createElement("div");
        exp.className = "explain";
        exp.id = "explain-" + i;
        exp.textContent = q.explain;
        div.appendChild(exp);

        area.appendChild(div);
      });

      window._currentQuestions = sortedQ;
    }

    function submitQuiz() {
      const qs = window._currentQuestions || questions;
      let correct = 0;
      const cardsEl = document.querySelectorAll(".question-card");

      qs.forEach((q, i) => {
        const ans = userAnswers[i];
        let isCorrect = false;
        if (q.type === "mc") {
          isCorrect = ans && ans.value === q.answer;
        } else {
          isCorrect = ans && ans.value === q.answer.toLowerCase();
        }

        if (isCorrect) {
          correct++;
        } else {
          data.weakPoints = data.weakPoints || {};
          data.weakPoints[q.point] = (data.weakPoints[q.point] || 0) + 1;
          const related = cards.find(c => c.word === q.point);
          if (related) {
            data.cardStatus = data.cardStatus || {};
            data.cardStatus[related.id] = "weak";
          }
        }

        const expEl = document.getElementById("explain-" + i);
        if (expEl) {
          expEl.classList.add("show");
          if (!isCorrect) expEl.style.borderColor = "var(--error)";
        }

        if (q.type === "mc") {
          const opts = cardsEl[i].querySelectorAll(".option");
          opts.forEach((o, j) => {
            o.onclick = null;
            if (j === q.answer) o.classList.add("correct");
            if (ans && ans.value === j && j !== q.answer) o.classList.add("wrong");
          });
        } else {
          const input = cardsEl[i].querySelector("input");
          input.disabled = true;
          if (isCorrect) {
            input.style.borderColor = "var(--success)";
          } else {
            input.style.borderColor = "var(--error)";
            input.placeholder = "正確答案：" + q.answer;
          }
        }
      });

      const percent = Math.round((correct / qs.length) * 100);
      data.quizHistory = data.quizHistory || [];
      data.quizHistory.push({ date: new Date().toISOString(), correct, total: qs.length, percent });
      if (data.quizHistory.length > 30) data.quizHistory = data.quizHistory.slice(-30);
      saveData(data);

      const result = document.getElementById("result");
      result.style.display = "block";
      result.innerHTML = `<div class="score">${correct} / ${qs.length}</div>
        <p style="margin-top:6px">正確率 ${percent}%</p>
        <p style="margin-top:6px;color:var(--muted)">${percent === 100 ? "全部答對！生活英文更穩了" : "已顯示解釋，相關單字會優先出現在單字卡"}</p>`;

      document.getElementById("submit-btn").style.display = "none";
      document.getElementById("retry-btn").style.display = "inline-block";
      buildCardOrder();
    }

    // Tabs
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.tab).classList.add("active");
      });
    });

    // Init
    buildCardOrder();
    showCard();
    startQuiz();
    updateStats();
  </script>
</body>
</html>
