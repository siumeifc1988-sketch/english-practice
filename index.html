<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="依照 A1 到 B2 程度循序解鎖的生活英文單字庫，涵蓋生活、旅行、餐廳與咖啡店。">
  <title>生活英文練習｜循序解鎖單字庫</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1120;--surface:#121c2d;--raised:#19263a;--soft:#202f45;--text:#f3f6fb;--muted:#a4b1c4;--accent:#73d5c2;--ink:#09241f;--line:#2a3a50;--good:#8de0ad;--bad:#ff9a9a;--warm:#ffd27b;--shadow:0 18px 48px #0004}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% -10%,#1c3b48 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif}button,input{font:inherit}button:focus-visible,input:focus-visible{outline:3px solid var(--warm);outline-offset:3px}.shell{width:min(980px,calc(100% - 32px));margin:auto;padding:28px 0 42px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:var(--accent);color:var(--ink);font-weight:900;font-size:21px}h1{font-size:clamp(1.25rem,4vw,1.7rem);margin:0}.subtitle{margin:2px 0 0;color:var(--muted);font-size:.87rem}.total-pill{white-space:nowrap;color:var(--accent);font-size:.82rem;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:8px 12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}.panel{min-width:0;border:1px solid var(--line);border-radius:20px;background:#121c2dee;padding:clamp(17px,3vw,27px);box-shadow:var(--shadow)}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:19px}.level{position:relative;min-height:63px;text-align:left;border:1px solid var(--line);border-radius:13px;background:#0e1726;padding:8px 10px;cursor:pointer}.level strong{display:block;color:var(--text);font-size:.9rem}.level span{color:var(--muted);font-size:.72rem}.level.active{border-color:var(--accent);background:#173536}.level.active strong{color:var(--accent)}.level:disabled{opacity:.55;cursor:not-allowed}.level:disabled:after{content:"🔒";position:absolute;right:9px;top:8px;font-size:.8rem}.level-progress{height:4px;background:#27364a;border-radius:9px;margin-top:6px;overflow:hidden}.level-progress i{display:block;height:100%;background:var(--accent);border-radius:9px}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.heading h2{font-size:1.13rem;margin:0}.category{font-size:.78rem;color:var(--muted)}.track{height:6px;background:#26364b;border-radius:9px;overflow:hidden;margin:12px 0 7px}.fill{height:100%;width:0;background:linear-gradient(90deg,#38b99f,var(--accent));transition:width .2s}.progress-text{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem}.card{min-height:290px;display:flex;flex-direction:column;justify-content:center;text-align:center;margin:20px 0 14px;padding:24px;border:1px solid #30445a;border-radius:20px;background:linear-gradient(145deg,#1a2a3e,#142033 70%)}.card-category{color:var(--accent);font-size:.78rem;margin-bottom:13px}.meaning{font-size:clamp(1.8rem,6vw,2.7rem);line-height:1.25;margin:0 0 12px}.answer{color:var(--accent);font-size:clamp(1.5rem,5vw,2.15rem);font-weight:800;margin:3px 0}.example{margin:15px 0 0;color:var(--text)}.translation{margin:3px 0 0;color:var(--muted);font-size:.87rem}.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.btn{min-height:47px;border:1px solid var(--line);border-radius:12px;background:var(--raised);color:var(--text);padding:10px 15px;font-weight:700;cursor:pointer}.btn:hover:not(:disabled){filter:brightness(1.12)}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink)}.btn.good{background:#1b4435;color:var(--good)}.btn.review{background:#482b32;color:var(--bad)}.actions .btn{flex:1}.status{min-height:25px;margin:12px 0 0;color:var(--muted);font-size:.84rem;text-align:center}.side h2{font-size:1.05rem;margin:0 0 4px}.side p{font-size:.83rem;color:var(--muted);margin:0 0 15px}.side h3{font-size:.86rem;margin:18px 0 8px}.side-card{padding:12px;border-radius:12px;background:var(--raised);margin-top:8px}.side-card strong{color:var(--accent)}.side-card span{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}.locked-note{padding:13px;border-radius:12px;background:#30291c;color:var(--warm);font-size:.82rem}.bank-list{display:grid;gap:6px}.bank-item{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;background:#0e1726;border-radius:9px;font-size:.81rem}.bank-item span:last-child{color:var(--muted);text-align:right}.quiz{margin-top:17px;border-top:1px solid var(--line);padding-top:17px}.quiz summary{cursor:pointer;font-weight:750}.quiz-q{margin:14px 0 8px;font-weight:650}.quiz-opts{display:grid;gap:7px}.quiz-opt{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#0e1726;cursor:pointer}.quiz-opt input{accent-color:var(--accent)}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:11px 16px;border:1px solid var(--line);border-radius:12px;background:var(--raised);box-shadow:var(--shadow);z-index:5}.toast[hidden]{display:none}footer{text-align:center;color:var(--muted);font-size:.77rem;margin-top:20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:760px){.shell{width:min(620px,calc(100% - 24px));padding:18px 0 30px}.layout{grid-template-columns:1fr}.side{order:2}.levels{gap:6px}.level{padding:8px 7px}.level span{font-size:.68rem}}
    @media(max-width:420px){.top{align-items:flex-start}.total-pill{font-size:.72rem;padding:7px 9px}.levels{grid-template-columns:repeat(2,1fr)}.level{min-height:57px}.card{min-height:260px;padding:20px 15px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn{width:100%}.panel{padding:15px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="logo" aria-hidden="true">A+</div><div><h1>生活英文單字庫</h1><p class="subtitle">從基礎開始，逐級解鎖真正用得到的英文</p></div></div><div class="total-pill"><span id="total-count">80</span> 個精選單字</div></header>
    <div class="layout">
      <section class="panel" aria-label="單字學習">
        <div class="levels" id="levels" aria-label="英文程度"></div>
        <div class="heading"><h2 id="level-title">A1 · 入門溝通</h2><span class="category" id="category-label">生活・旅行・餐廳・咖啡</span></div>
        <div class="track" role="progressbar" aria-label="目前級別掌握進度" aria-valuemin="0" aria-valuemax="100" id="progress"><div class="fill" id="progress-fill"></div></div>
        <div class="progress-text"><span id="progress-label">已掌握 0 / 20</span><span id="card-position">1 / 20</span></div>
        <article class="card" aria-live="polite">
          <div class="card-category" id="card-category"></div><h2 class="meaning" id="meaning"></h2>
          <div id="revealed" hidden><div class="answer" id="word"></div><button class="btn" id="speak" type="button">🔊 聽發音</button><p class="example" id="example"></p><p class="translation" id="translation"></p></div>
          <p class="status" id="hint">先想想英文怎麼說，再顯示答案。</p>
        </article>
        <div class="row actions"><button class="btn" id="prev" type="button">← 上一個</button><button class="btn primary" id="show-answer" type="button">顯示答案</button><button class="btn review" id="review" type="button" disabled>再複習</button><button class="btn good" id="known" type="button" disabled>認識了</button><button class="btn" id="next" type="button">下一個 →</button></div>
        <details class="quiz"><summary>小測驗：測試目前級別的單字</summary><div id="quiz-content"></div><div class="row"><button class="btn primary" id="check-quiz" type="button">檢查答案</button><button class="btn" id="new-quiz" type="button">換一題</button></div><p class="status" id="quiz-feedback" aria-live="polite"></p></details>
      </section>
      <aside class="panel side"><h2>你的學習路線</h2><p>每級有 20 個生活常用字。認識上一級至少 12 個單字，就能解鎖下一級。已保留舊版的單字學習標記。</p><div id="unlock-info"></div><h3>本級單字一覽</h3><div class="bank-list" id="bank-list"></div></aside>
    </div>
    <footer>學習紀錄保存在目前裝置的瀏覽器。建議先熟悉常用字，再逐步挑戰更進階的表達。</footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="data/words.js"></script>
  <script>
    const LEVELS=[{id:"A1",name:"入門溝通",threshold:0},{id:"A2",name:"日常應用",threshold:12},{id:"B1",name:"獨立溝通",threshold:12},{id:"B2",name:"流暢表達",threshold:12}];
    const KEY="dailyEnglishV3"; const $=id=>document.getElementById(id); let data=load(); let selectedLevel="A1"; let cards=[]; let current=0; let revealed=false; let toastTimer; let quizCard=null;
    function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null")||{};return{...d,quizHistory:Array.isArray(d.quizHistory)?d.quizHistory:[],cardStatus:d.cardStatus&&typeof d.cardStatus==="object"?d.cardStatus:{},weakPoints:d.weakPoints&&typeof d.weakPoints==="object"?d.weakPoints:{}}}catch{return{quizHistory:[],cardStatus:{},weakPoints:{}}}}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch{notify("無法儲存進度，請檢查瀏覽器儲存空間。")}}
    function mastered(level){return window.WORDS.filter(w=>w.level===level&&data.cardStatus[w.id]==="known").length}
    function unlocked(level){const index=LEVELS.findIndex(l=>l.id===level);return index===0||mastered(LEVELS[index-1].id)>=LEVELS[index].threshold}
    function notify(text){const el=$("toast");el.textContent=text;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2400)}
    function renderLevels(){const wrap=$("levels");wrap.replaceChildren();LEVELS.forEach((level,index)=>{const open=unlocked(level.id);const count=window.WORDS.filter(w=>w.level===level.id).length;const button=document.createElement("button");button.type="button";button.className="level"+(selectedLevel===level.id?" active":"");button.disabled=!open;button.setAttribute("aria-label",`${level.id} ${level.name}${open?"":"，尚未解鎖"}`);button.innerHTML=`<strong>${level.id}${open?"":" 🔒"}</strong><span>${level.name} · ${mastered(level.id)}/${count}</span><div class="level-progress"><i style="width:${count?Math.round(mastered(level.id)/count*100):0}%"></i></div>`;button.addEventListener("click",()=>{selectedLevel=level.id;current=0;render()});wrap.append(button)})}
    function render(){renderLevels();cards=window.WORDS.filter(w=>w.level===selectedLevel);if(!cards.length)return;current=Math.min(current,cards.length-1);const level=LEVELS.find(l=>l.id===selectedLevel);$("level-title").textContent=`${level.id} · ${level.name}`;$("card-position").textContent=`${current+1} / ${cards.length}`;const total=mastered(selectedLevel);$("progress-label").textContent=`已掌握 ${total} / ${cards.length}`;const pct=Math.round(total/cards.length*100);$("progress-fill").style.width=pct+"%";$("progress").setAttribute("aria-valuenow",pct);const card=cards[current];$("card-category").textContent=`${card.category} · ${card.level}`;$("meaning").textContent=card.meaning;$("word").textContent=card.word;$("example").textContent=card.example;$("translation").textContent=card.translation;revealed=false;$("revealed").hidden=true;$("hint").textContent="先想想英文怎麼說，再顯示答案。";$("show-answer").hidden=false;$("review").disabled=true;$("known").disabled=true;$("review").textContent=data.cardStatus[card.id]==="weak"?"再複習":"再複習";renderBank();renderUnlockInfo();renderQuiz()}
    function reveal(){if(revealed)return;revealed=true;$("revealed").hidden=false;$("hint").textContent=data.cardStatus[cards[current].id]==="known"?"你已標記認識這個單字。":"知道答案後，選擇你的熟悉程度。";$("show-answer").hidden=true;$("review").disabled=false;$("known").disabled=false}
    function move(step){current=(current+step+cards.length)%cards.length;render()}
    function rate(status){if(!revealed){notify("先顯示答案，再選擇熟悉程度。");return}const card=cards[current];data.cardStatus[card.id]=status;save();const wasLocked=LEVELS.slice(1).map(l=>[l.id,unlocked(l.id)]);render();const newly=LEVELS.find((l,i)=>i>0&&!wasLocked[i-1][1]&&unlocked(l.id));if(newly)notify(`恭喜！已解鎖 ${newly.id} · ${newly.name}`);else notify(status==="known"?"已記為認識，繼續加油！":"已加入複習。`);if(status==="known"&&current<cards.length-1)move(1)}
    function renderBank(){const list=$("bank-list");list.replaceChildren();cards.forEach((card,i)=>{const row=document.createElement("div");row.className="bank-item";const word=document.createElement("span");word.textContent=`${i+1}. ${card.word}`;const meaning=document.createElement("span");meaning.textContent=card.meaning;row.append(word,meaning);row.tabIndex=0;row.setAttribute("role","button");row.setAttribute("aria-label",`學習 ${card.word}，${card.meaning}`);row.addEventListener("click",()=>{current=i;render()});list.append(row)});$("total-count").textContent=window.WORDS.length}
    function renderUnlockInfo(){const box=$("unlock-info");box.replaceChildren();LEVELS.slice(1).forEach((level,index)=>{const previous=LEVELS[index].id;const need=level.threshold;const have=mastered(previous);const item=document.createElement("div");item.className="side-card";const title=document.createElement("strong");title.textContent=`${level.id} · ${level.name}`;const description=document.createElement("span");description.textContent=unlocked(level.id)?"已解鎖，可以開始學習！":`先在 ${previous} 認識 ${need} 個單字（目前 ${have}/${need}）`;item.append(title,description);box.append(item)})}
    function speak(){if(!("speechSynthesis"in window)){notify("此瀏覽器不支援語音播放。");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cards[current].word);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}
    function renderQuiz(){const box=$("quiz-content");box.replaceChildren();$("quiz-feedback").textContent="";const pool=cards.filter(w=>w.id!==cards[current].id);quizCard=cards[Math.floor(Math.random()*cards.length)];const q=document.createElement("p");q.className="quiz-q";q.textContent=`「${quizCard.meaning}」的英文是什麼？`;box.append(q);const distractors=[];while(distractors.length<Math.min(3,pool.length)){const item=pool[Math.floor(Math.random()*pool.length)];if(!distractors.some(d=>d.id===item.id))distractors.push(item)}const options=[quizCard,...distractors].sort(()=>Math.random()-.5);const list=document.createElement("div");list.className="quiz-opts";options.forEach(option=>{const label=document.createElement("label");label.className="quiz-opt";const radio=document.createElement("input");radio.type="radio";radio.name="vocab-quiz";radio.value=option.id;const text=document.createElement("span");text.textContent=option.word;label.append(radio,text);list.append(label)});box.append(list)}
    function checkQuiz(){const answer=document.querySelector('input[name="vocab-quiz"]:checked');if(!answer){$("quiz-feedback").textContent="請先選一個答案。";return}const correct=answer.value===quizCard.id;$("quiz-feedback").textContent=correct?"答對了！太棒了。":"答案是「"+quizCard.word+"」。再看一次例句，加深記憶。";if(correct){data.weakPoints[quizCard.word]=Math.max(0,(data.weakPoints[quizCard.word]||0)-1)}else{data.weakPoints[quizCard.word]=(data.weakPoints[quizCard.word]||0)+1;data.cardStatus[quizCard.id]="weak"}save();document.querySelectorAll('input[name="vocab-quiz"]').forEach(input=>input.disabled=true);renderLevels();renderUnlockInfo()}
    $("show-answer").addEventListener("click",reveal);$("speak").addEventListener("click",speak);$("prev").addEventListener("click",()=>move(-1));$("next").addEventListener("click",()=>move(1));$("review").addEventListener("click",()=>rate("weak"));$("known").addEventListener("click",()=>rate("known"));$("new-quiz").addEventListener("click",renderQuiz);$("check-quiz").addEventListener("click",checkQuiz);document.addEventListener("keydown",e=>{if(e.target instanceof HTMLInputElement)return;if(e.key==="ArrowLeft")move(-1);if(e.key==="ArrowRight")move(1);if(e.key==="Enter"&&!revealed)reveal()});
    render();
  </script>
</body>
</html>
