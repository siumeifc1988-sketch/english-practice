<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文練習 | A1-A2 Flashcards</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #4ade80;
      --error: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.5;
    }
    .container { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; text-align: center; }
    .subtitle { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: 0.95rem; }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab.active { background: var(--accent); color: #0f172a; font-weight: 600; }
    .panel { display: none; }
    .panel.active { display: block; }

    /* Flashcard */
    .flashcard {
      background: var(--card);
      border-radius: 16px;
      padding: 32px 24px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      transition: transform 0.2s;
      margin-bottom: 16px;
      position: relative;
    }
    .flashcard:active { transform: scale(0.98); }
    .flashcard .label {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .flashcard .front, .flashcard .back { width: 100%; }
    .flashcard .back { display: none; }
    .flashcard.flipped .front { display: none; }
    .flashcard.flipped .back { display: block; }
    .card-text { font-size: 1.35rem; margin-bottom: 8px; }
    .card-note { font-size: 0.9rem; color: var(--muted); margin-top: 12px; }
    .card-example { font-size: 0.95rem; color: var(--accent); margin-top: 8px; }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
    }
    button.btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      background: var(--card);
      color: var(--text);
    }
    button.btn.primary { background: var(--accent); color: #0f172a; font-weight: 600; }
    .progress { text-align: center; color: var(--muted); margin: 12px 0; font-size: 0.9rem; }

    /* Quiz */
    .question-card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .q-num { color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; }
    .q-text { font-size: 1.15rem; margin-bottom: 16px; }
    .options { display: flex; flex-direction: column; gap: 8px; }
    .option {
      padding: 12px 16px;
      background: #334155;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.15s;
    }
    .option:hover { background: #475569; }
    .option.selected { background: var(--accent); color: #0f172a; }
    .option.correct { background: var(--success); color: #0f172a; }
    .option.wrong { background: var(--error); color: #0f172a; }
    .fill-input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #334155;
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
    }
    .result { margin-top: 20px; text-align: center; font-size: 1.1rem; }
    .score { font-size: 2rem; font-weight: 700; color: var(--accent); }

    footer { text-align: center; margin-top: 40px; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>英文練習</h1>
    <p class="subtitle">A1 → A2 · 專為中文使用者設計</p>

    <div class="tabs">
      <button class="tab active" data-tab="flash">Flashcard</button>
      <button class="tab" data-tab="quiz">練習題</button>
    </div>

    <!-- Flashcard Panel -->
    <div id="flash" class="panel active">
      <div class="progress" id="flash-progress">1 / 6</div>
      <div class="flashcard" id="card" onclick="flipCard()">
        <div class="label">點擊卡片翻面</div>
        <div class="front">
          <div class="card-text" id="front-text"></div>
        </div>
        <div class="back">
          <div class="card-text" id="back-text"></div>
          <div class="card-note" id="back-note"></div>
          <div class="card-example" id="back-example"></div>
        </div>
      </div>
      <div class="controls">
        <button class="btn" onclick="prevCard()">上一張</button>
        <button class="btn primary" onclick="nextCard()">下一張</button>
      </div>
    </div>

    <!-- Quiz Panel -->
    <div id="quiz" class="panel">
      <div id="quiz-area"></div>
      <div class="controls" style="margin-top:20px">
        <button class="btn primary" id="submit-btn" onclick="submitQuiz()">提交答案</button>
        <button class="btn" id="retry-btn" style="display:none" onclick="startQuiz()">再練一次</button>
      </div>
      <div class="result" id="result" style="display:none"></div>
    </div>

    <footer>GitHub Pages · 可自由修改內容</footer>
  </div>

  <script>
    // ===== Flashcards Data =====
    const cards = [
      {
        front: "我有一隻狗。",
        back: "I have a dog.",
        note: "單數可數名詞前面通常要加 a / an",
        example: "She has a cat."
      },
      {
        front: "她很開心。",
        back: "She is happy.",
        note: "形容詞前面通常需要 be 動詞 (am/is/are)",
        example: "They are tired."
      },
      {
        front: "他喜歡蘋果。",
        back: "He likes apples.",
        note: "第三人稱單數 (he/she/it) 現在式動詞要加 -s",
        example: "She works every day."
      },
      {
        front: "我在星期一上班。",
        back: "I work on Monday.",
        note: "星期幾前面用 on",
        example: "We meet on Friday."
      },
      {
        front: "昨天我去了公園。",
        back: "Yesterday I went to the park.",
        note: "有過去時間詞時，動詞要用過去式",
        example: "She bought a book yesterday."
      },
      {
        front: "桌子上有兩個蘋果。",
        back: "There are two apples on the table.",
        note: "複數要用 There are + 複數名詞",
        example: "There is a book on the desk."
      }
    ];

    let current = 0;

    function showCard() {
      const c = cards[current];
      document.getElementById("front-text").textContent = c.front;
      document.getElementById("back-text").textContent = c.back;
      document.getElementById("back-note").textContent = c.note;
      document.getElementById("back-example").textContent = "例句：" + c.example;
      document.getElementById("flash-progress").textContent = (current + 1) + " / " + cards.length;
      document.getElementById("card").classList.remove("flipped");
    }

    function flipCard() {
      document.getElementById("card").classList.toggle("flipped");
    }

    function nextCard() {
      current = (current + 1) % cards.length;
      showCard();
    }

    function prevCard() {
      current = (current - 1 + cards.length) % cards.length;
      showCard();
    }

    // ===== Quiz Data =====
    const questions = [
      {
        type: "mc",
        q: "選擇正確的句子",
        options: ["She go to work by bus.", "She goes to work by bus.", "She going to work by bus."],
        answer: 1
      },
      {
        type: "fill",
        q: "我在星期一上班。 → I work ______ Monday.",
        answer: "on"
      },
      {
        type: "mc",
        q: "選擇正確的句子",
        options: ["Where you live?", "Where do you live?", "Where are you live?"],
        answer: 1
      },
      {
        type: "fill",
        q: "他昨天買了一本書。 → He ______ a book yesterday.",
        answer: "bought"
      },
      {
        type: "mc",
        q: "選擇正確的句子",
        options: ["There is two apples on the table.", "There are two apples on the table.", "There be two apples on the table."],
        answer: 1
      }
    ];

    let userAnswers = [];

    function startQuiz() {
      userAnswers = [];
      const area = document.getElementById("quiz-area");
      area.innerHTML = "";
      document.getElementById("result").style.display = "none";
      document.getElementById("submit-btn").style.display = "inline-block";
      document.getElementById("retry-btn").style.display = "none";

      questions.forEach((q, i) => {
        const div = document.createElement("div");
        div.className = "question-card";
        div.innerHTML = `<div class="q-num">第 ${i + 1} 題</div><div class="q-text">${q.q}</div>`;

        if (q.type === "mc") {
          const opts = document.createElement("div");
          opts.className = "options";
          q.options.forEach((opt, j) => {
            const o = document.createElement("div");
            o.className = "option";
            o.textContent = opt;
            o.onclick = () => {
              opts.querySelectorAll(".option").forEach(el => el.classList.remove("selected"));
              o.classList.add("selected");
              userAnswers[i] = j;
            };
            opts.appendChild(o);
          });
          div.appendChild(opts);
        } else {
          const input = document.createElement("input");
          input.className = "fill-input";
          input.placeholder = "請輸入答案";
          input.oninput = (e) => userAnswers[i] = e.target.value.trim().toLowerCase();
          div.appendChild(input);
        }
        area.appendChild(div);
      });
    }

    function submitQuiz() {
      let correct = 0;
      questions.forEach((q, i) => {
        const cards = document.querySelectorAll(".question-card");
        if (q.type === "mc") {
          const opts = cards[i].querySelectorAll(".option");
          opts.forEach((o, j) => {
            o.onclick = null;
            if (j === q.answer) o.classList.add("correct");
            if (userAnswers[i] === j && j !== q.answer) o.classList.add("wrong");
          });
          if (userAnswers[i] === q.answer) correct++;
        } else {
          const input = cards[i].querySelector("input");
          input.disabled = true;
          if (userAnswers[i] === q.answer.toLowerCase()) {
            input.style.borderColor = "var(--success)";
            correct++;
          } else {
            input.style.borderColor = "var(--error)";
            input.value = userAnswers[i] || "";
            input.placeholder = "正確答案：" + q.answer;
          }
        }
      });

      const result = document.getElementById("result");
      result.style.display = "block";
      result.innerHTML = `<div class="score">${correct} / ${questions.length}</div>
        <p style="margin-top:8px">${correct === questions.length ? "太棒了！全部答對！" : "繼續加油，晚上再複習 Flashcard 吧！"}</p>`;

      document.getElementById("submit-btn").style.display = "none";
      document.getElementById("retry-btn").style.display = "inline-block";
    }

    // Tabs
    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById(tab.dataset.tab).classList.add("active");
      });
    });

    // Init
    showCard();
    startQuiz();
  </script>
</body>
</html>
